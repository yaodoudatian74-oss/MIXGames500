B2HAUL.run=(G,p)=>{const R=G.R;const need=p.need||5,cap=p.cap||1,nz=p.zones||1;
  ground(p.floor||'#4a3c2a',300,0);setSky(p.sky||'#bfe6ff',{near:50,far:200});
  G.need=need;G.keys=0;G.carry=0;G.scoreLabel='はこんだ数';G.scoreAsc=false;G.scoreFmt=v=>String(v);
  P.maxHp=100;P.hp=100;showHp(true,false);
  // 壁（まん中のはこび場所の近くはあける）
  for(let i=0;i<(p.walls||0);i++){const x=(R()-.5)*90,z=(R()-.5)*90;if(Math.hypot(x,z)<10)continue;const s=3+R()*3;addPart(x,2.5,z,s,5,s,p.wall||'#6b7280','solid')}
  // はこび場所（ピンクのパッド）
  const zoneAt=[];for(let i=0;i<nz;i++){const a=i/nz*Math.PI*2+.8;zoneAt.push({x:Math.cos(a)*7,z:Math.sin(a)*7})}
  zoneAt.forEach((z,i)=>{addPart(z.x,.15,z.z,4,.3,4,'#ff4fb8','solid');
    addPrompt({pos:new V3(z.x,1,z.z),r:3,label:()=>G.carry>0?`ここにおろす（${G.carry}個）`:'はこぶものを持っていない',act:()=>{
      if(G.carry<=0){toast('まずブレインロットをひろってね');return}
      G.keys+=G.carry;toast(G.carry+'個おろした！');G.carry=0;setExtra('はこんだ',G.keys+'/'+G.need);SFX.pop();
      if(G.keys>=G.need&&!G.won){G.won=true;gameEnd(G,Math.floor(G.time),'はこびタイム(秒)',true)}}})});
  setExtra('はこんだ',0+'/'+G.need);
  // ブレインロット（はこぶもの）を置く。ひとつずつひろう
  for(let i=0;i<need;i++){let x,z,n=0;do{x=(R()-.5)*90;z=(R()-.5)*90;n++}while((Math.hypot(x,z)<12||zoneAt.some(q=>Math.hypot(x-q.x,z-q.z)<10))&&n<200);
    const bid=rollBR(R,[0,0,20,30,30,15,5]);const g=makeBrainrot(bid,.8);g.position.set(x,1,z);world.add(g);
    const pr=addPrompt({obj:g,r:2.4,label:()=>'ひろう：'+BR[bid].name,act:()=>{if(G.over)return;
      if(G.carry>=cap){toast('もう持てない！（まずおろしてね）');return}
      G.carry++;world.remove(g);disposeTree(g);removePrompt(pr);SFX.pop();toast('ひろった！（'+G.carry+'/'+cap+'）')}})}
  // 守衛（見つけると追いかけてくる）
  G.guards=[];
  for(let i=0;i<(p.guards||0);i++){const a=i/Math.max(1,p.guards)*Math.PI*2+1.2;
    G.guards.push(spawnEnemy({kind:'humanoid',shirt:'#e5484d',skin:pick(Math.random,SKINS),hat:'cap',hp:99999,dmg:p.dmg||10,spd:p.spd||5,aggro:p.aggro||30,reach:2.2,rate:1.1,size:1,name:'ブレインロット守衛'},Math.cos(a)*36,Math.sin(a)*36))}
  G.spawn=()=>new V3(0,.4,0);
  if(p.time)timeLimit(G,p.time,()=>{if(G.over||G.won)return;G.over=true;showResult({win:false,title:'時間切れ',text:`はこんだ ${G.keys} / ${G.need} 個`})});
  G.onDeath=()=>{if(G.over||G.won)return;G.over=true;showResult({win:false,title:'つかまった…',text:`はこんだ ${G.keys} / ${G.need} 個`})};
  G.update=(dt,t)=>{G.tick(dt);tickLimit(G);
    P.score=G.keys};
  setObjective(p.obj||'ブレインロットをひろって、ピンクのパッドにはこぼう');
  return G};

/* =====================================================================
   GENRE: ダンスジャッジ（ステージでダンサー2人が踊る。どっちのセンスがいいか★で採点する）

const DANCE={};
GENRES.dance=(def,R)=>{const G=newGame(def,R);DANCE.run(G,def.p||{});return G};

// 採点の画面（ゲームの時だけ出す）
function danceJudgeBox(){let b=document.getElementById('danceJudge');
  if(!b){b=document.createElement('div');b.id='danceJudge';
    b.style.cssText='position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);background:rgba(20,16,40,.92);border-radius:16px;padding:12px;z-index:25;color:#fff;font-weight:700;text-align:center;min-width:250px';
    document.body.append(b)}
  return b}
function hideGameOverlays(){const b=document.getElementById('danceJudge');if(b)b.hidden=true;const e=document.getElementById('emoteGame');if(e)e.hidden=true;const bd=document.getElementById('bladeDraw');if(bd)bd.hidden=true}

DANCE.run=(G,p)=>{const R=G.R;
  ground('#2b2238',300,0);setSky('#1b1530',{near:50,far:200});
  // ステージ（ゆかの光）
  addPart(0,.05,-12,16,.1,10,'#6b3fa0','solid');
  addPart(-9,5,-17,1,10,1,'#ffd23f','solid',{kind:'glow'});
  addPart(9,5,-17,1,10,1,'#ff4fb8','solid',{kind:'glow'});
  G.scoreLabel='センス点';G.scoreAsc=false;G.scoreFmt=v=>v+' ★';
  G.spawn=()=>new V3(0,.4,8);
  G.emotes=DANCE_EMOTE_NAMES;
  G.rounds=p.rounds||5;G.round=0;G.total={g:0,b:0};G.rate={g:0,b:0};G.over=false;
  // ダンサー（女の子・男の子）
  const girl=makeWalker({prop:'cactusflower',costume:'none',bh:'slim',bw:'slim',skin:'#f2c49b',shirt:'#ff7ab6',pants:'#a46bff',hat:'none',hair:'long',hairC:'#7a4cff',acc:'none'},-3,-12,{y:0});
  const boy=makeWalker({prop:'cap',costume:'none',bh:'normal',bw:'normal',skin:'#c98d5f',shirt:'#1f6feb',pants:'#2b3a55',hat:'cap',hair:'short',hairC:'#2b1d12',acc:'none'},3,-12,{y:0});
  G.dancers={girl,boy};
  setObjective('ダンサーのセンスを★で採点しよう（5ラウンド）');

  DANCE.nextRound=()=>{if(G.over)return;G.round++;
    if(G.round>G.rounds){DANCE.finish();return}
    girl.emote=4+Math.floor(R()*DANCE_EMOTE_ROWS.length);boy.emote=4+Math.floor(R()*DANCE_EMOTE_ROWS.length);
    banner('ラウンド '+G.round+'：ダンス！',1800);
    G.after(6,()=>DANCE.showJudge())};

  DANCE.showJudge=()=>{if(G.over)return;G.rate={g:0,b:0};const box=danceJudgeBox();box.hidden=false;box.textContent='';
    const title=document.createElement('div');title.textContent='どっちのセンスがいい？（'+G.round+'/'+G.rounds+'）';title.style.marginBottom='8px';box.append(title);
    [['g','女の子'],['b','男の子']].forEach(([k,nm])=>{const row=document.createElement('div');row.style.cssText='display:flex;gap:4px;align-items:center;justify-content:center;margin:4px 0';
      const l=document.createElement('span');l.textContent=nm;l.style.width='60px';row.append(l);
      for(let n=1;n<=5;n++){const b=document.createElement('button');b.className='btn ghost';b.textContent='★'+n;b.style.cssText='padding:6px 8px;font-size:12px';
        b.onclick=()=>DANCE.rate(k,n,box);row.append(b)}
      box.append(row)})};

  DANCE.rate=(k,n,box)=>{if(G.over)return;G.rate[k]=n;toast((k==='g'?'女の子':'男の子')+'：★'+n);
    if(G.rate.g&&G.rate.b){G.total.g+=G.rate.g;G.total.b+=G.rate.b;box.hidden=true;G.after(1.5,()=>DANCE.nextRound())}};

  DANCE.finish=()=>{const w=G.total.g===G.total.b?'ひきわけ':(G.total.g>G.total.b?'女の子':'男の子');
    const hi=Math.max(G.total.g,G.total.b);hideGameOverlays();
    gameEnd(G,hi,'優勝は '+w+' ／ 合計（女の子 '+G.total.g+'★・男の子 '+G.total.b+'★）',true)};

  G.update=(dt,t)=>{G.tick(dt);P.score=Math.max(G.total.g,G.total.b)};
  G.after(1,()=>DANCE.nextRound());
  return G};

/* =====================================================================
   GENRE: 絵ベイブレード（自分で絵をかいて、コマの土台にのせて戦う）
   まず絵をかく（おまかせもOK）→ コマどうしをぶつけて、回転（ねばり）をなくした方が負け
   テーマ5 × 強さ4 = 20個
   ===================================================================== */
const BLADE={};
GENRES.bladepic=(def,R)=>{const G=newGame(def,R);BLADE.run(G,def.p||{});return G};

const BLADE_PALETTE=['#111111','#ff3b3b','#ff9f1c','#ffe066','#3fb55a','#3fb0ff','#a46bff','#ff4fb8'];
const BLADE_BASES=['#e5484d','#3fb0ff','#3fb55a','#ff9f1c','#a46bff','#ffd23f','#ff4fb8','#22d3ee'];

// 相手のコマの絵（ランダムなもよう）
function bladeOppTex(R){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const pal=()=>BLADE_PALETTE[1+Math.floor(R()*7)];
  const kind=Math.floor(R()*6);
  g.fillStyle='#ffffff';g.fillRect(0,0,256,256);
  if(kind===0){for(let i=0;i<12;i++){g.fillStyle=pal();g.fillRect(i*22-10,0,12,256)}}
  else if(kind===1){for(let i=0;i<9;i++){g.fillStyle=pal();const x=R()*256,y=R()*256,r=10+R()*18;g.beginPath();
    for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,rr=k%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath();g.fill()}}
  else if(kind===2){g.fillStyle=pal();g.beginPath();g.arc(128,128,100,0,Math.PI*2);g.fill();
    g.fillStyle='#111111';g.beginPath();g.arc(92,110,14,0,Math.PI*2);g.arc(164,110,14,0,Math.PI*2);g.fill();
    g.strokeStyle='#111111';g.lineWidth=10;g.beginPath();g.arc(128,150,50,.2,Math.PI-.2);g.stroke()}
  else if(kind===3){g.strokeStyle=pal();g.lineWidth=12;g.beginPath();
    for(let t=0;t<40;t+=.1){const r=t*2.2;const x=128+Math.cos(t)*r,y=128+Math.sin(t)*r;if(t)g.lineTo(x,y);else g.moveTo(x,y)}g.stroke()}
  else if(kind===4){const n=6,s=256/n;for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x+y)%2){g.fillStyle=pal();g.fillRect(x*s,y*s,s,s)}}}
  else{g.fillStyle='#ffd23f';g.beginPath();g.arc(128,128,60,0,Math.PI*2);g.fill();
    g.strokeStyle='#ff9f1c';g.lineWidth=14;
    for(let i=0;i<12;i++){const a=i/12*Math.PI*2;g.beginPath();g.moveTo(128+Math.cos(a)*72,128+Math.sin(a)*72);g.lineTo(128+Math.cos(a)*112,128+Math.sin(a)*112);g.stroke()}}
  return new THREE.CanvasTexture(c)};

// コマ（土台の上に絵のディスク）
function bladeTop(tex,baseCol){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(1,.75,.55,24),new THREE.MeshStandardMaterial({color:baseCol,roughness:.4,metalness:.3}));
  base.position.y=.28;base.castShadow=true;
  const face=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,.12,32),[
    new THREE.MeshStandardMaterial({color:'#ffffff'}),
    new THREE.MeshStandardMaterial({map:tex}),
    new THREE.MeshStandardMaterial({color:'#ffffff'})]);
  face.position.y=.6;face.castShadow=true;
  const tip=new THREE.Mesh(new THREE.ConeGeometry(.22,.6,12),new THREE.MeshStandardMaterial({color:'#9aa3ad',metalness:.6,roughness:.3}));
  tip.rotation.x=Math.PI;tip.position.y=-.25;
  g.add(base,face,tip);return g};

  const g=cv.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,256,256);

  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*256/r.width,y:(e.clientY-r.top)*256/r.height}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;last=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}
    g.fillStyle=col;g.beginPath();g.arc(last.x,last.y,size/2,0,Math.PI*2);g.fill()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const q=pos(e);
    g.strokeStyle=col;g.lineWidth=size;g.lineCap='round';g.beginPath();g.moveTo(last.x,last.y);g.lineTo(q.x,q.y);g.stroke();last=q});
  const up=()=>{drawing=false};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  const pal=document.createElement('div');pal.style.cssText='display:flex;gap:6px;flex-wrap:wrap;justify-content:center';
  BLADE_PALETTE.forEach(c=>{const b=document.createElement('button');
    b.style.cssText=`width:30px;height:30px;border-radius:50%;border:3px solid ${c==='#111111'?'#888888':'#ffffff'};background:${c};cursor:pointer`;
    b.onclick=()=>{col=c};pal.append(b)});
  const tools=document.createElement('div');tools.style.cssText='display:flex;gap:6px;flex-wrap:wrap;justify-content:center';
  [[3,'細'],[7,'中'],[16,'太']].forEach(([s,nm])=>{const b=bladeMkBtn(nm,'ghost');b.onclick=()=>{size=s};tools.append(b)});
  const clr=bladeMkBtn('ぜんぶ消す','ghost');clr.onclick=()=>{g.fillStyle='#ffffff';g.fillRect(0,0,256,256)};
  const rnd=bladeMkBtn('おまかせ','ghost');rnd.onclick=()=>BLADE.finishDraw(G,p,null);
  const ok=bladeMkBtn('できた！','go');ok.onclick=()=>BLADE.finishDraw(G,p,cv);
  tools.append(clr,rnd,ok);
  o.append(title,cv,pal,tools);
};

BLADE.finishDraw=(G,p,cv)=>{
  if(G.phase!=='draw')return;
  const o=document.getElementById('bladeDraw');if(o)o.hidden=true;
  let tex;
  if(cv){const c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(cv,0,0);tex=new THREE.CanvasTexture(c)}
  else tex=bladeOppTex(G.R);
  G.phase='count';
  BLADE.spawnTops(G,p,bladeTop(tex,'#ff4fb8'));
  banner('3・2・1…',1100);
  G.after(1.2,()=>{if(G.over)return;G.phase='battle';banner('バトル開始！',1500)});
};

BLADE.spawnTops=(G,p,playerMesh)=>{
  G.tops=[];const n=G.n;
  for(let i=0;i<n;i++){
    const isP=i===0;const a=i/n*Math.PI*2+.5;
    const mesh=isP?playerMesh:bladeTop(bladeOppTex(G.R),BLADE_BASES[(i*3+1)%BLADE_BASES.length]);
    mesh.scale.setScalar(1.2);world.add(mesh);
    G.tops.push({isP,mesh,pos:new V3(Math.cos(a)*5.5,0,Math.sin(a)*5.5),vel:new V3(0,0,0),spin:1,out:false,wob:G.R()*6,tgt:null,tt:G.R()*1.5});
  }
  G.player=G.tops[0];
};

BLADE.run=(G,p)=>{const R=G.R;const AR=p.arena||12;
  ground(p.floor||'#2b2238',300,0);setSky(p.sky||'#1b1530',{near:50,far:200});
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(AR,AR,.4,56),new THREE.MeshStandardMaterial({color:p.arenaC||'#7c5cff',roughness:.6}));
  disc.position.y=.1;disc.receiveShadow=true;world.add(disc);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(AR,.35,8,56),new THREE.MeshStandardMaterial({color:p.rim||'#ffd23f',emissive:p.rim||'#ffd23f',emissiveIntensity:.4}));
  rim.rotation.x=Math.PI/2;rim.position.y=.2;world.add(rim);
  G.phase='draw';G.n=p.tops||3;G.ar=AR;G.edgeOut=!!p.edgeOut;G.aiSpd=p.ai||.8;G.decay=p.decay||.016;
  G.camDist=16;G.dashCd=0;G.bt=0;G.anim=0;G.tops=[];G.player=null;
  G.scoreLabel='のこった回転';G.scoreAsc=false;G.scoreFmt=v=>v+' %';
  G.spawn=()=>new V3(0,.4,0);
  P.locked=true;myAv.root.visible=false;
  G.actionLabel=()=>G.dashCd>0?'…':'ダッシュ';
  G.action=()=>{if(G.phase!=='battle'||G.dashCd>0||!G.player||G.player.out||G.over)return;
    const me=G.player;let dx=me.vel.x,dz=me.vel.z;const sp=Math.hypot(dx,dz);
    if(sp<1){dx=0;dz=-1}else{dx/=sp;dz/=sp}
    me.vel.x+=dx*14;me.vel.z+=dz*14;me.spin=Math.max(0,me.spin-.03);G.dashCd=2;toast('ダッシュ！');SFX.pop()};
  G.dispose=()=>{const o=document.getElementById('bladeDraw');if(o)o.hidden=true;P.locked=false;if(myAv)myAv.root.visible=true};
  G.update=(dt)=>{G.tick(dt);G.anim+=dt;
    if(G.over)return;
    if(G.phase==='battle')BLADE.step(G,p,dt);
    if(G.player&&!G.over){P.pos.set(G.player.pos.x,.6,G.player.pos.z);myAv.root.visible=false}
    G.tops.forEach(tp=>{
      if(tp.out){tp.mesh.visible=false;return}
      tp.mesh.position.set(tp.pos.x,0,tp.pos.z);
      tp.mesh.rotation.y+=dt*(3+tp.spin*28);
      tp.mesh.rotation.z=Math.sin(G.anim*18+tp.wob)*(1-tp.spin)*.35;
      tp.mesh.rotation.x=Math.cos(G.anim*16+tp.wob)*(1-tp.spin)*.2;
    });
  };
  BLADE.openDraw(G,p);
  return G};

BLADE.step=(G,p,dt)=>{
  const me=G.player;if(!me)return;
  G.bt+=dt;G.dashCd=Math.max(0,G.dashCd-dt);
  // 操作（キーボード・スティック）
  let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let iz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(joy.id!==null){ix+=joy.vx;iz+=joy.vy}
  const L=Math.hypot(ix,iz);if(L>1){ix/=L;iz/=L}
  // 相手のコマの動き
  G.tops.forEach(tp=>{if(tp.out)return;
    let ax=0,az=0;
    if(tp.isP){ax=ix*16;az=iz*16}
    else{
      tp.tt-=dt;
      const alive=G.tops.filter(o=>o!==tp&&!o.out);
      if(tp.tt<=0||!tp.tgt||tp.tgt.out){tp.tt=.6+R2(G)*1.2;
        tp.tgt=(alive.length&&R2(G)<.6)?(alive.includes(me)?me:alive[0]):(alive[Math.floor(R2(G)*alive.length)]||null)}
      if(tp.tgt){const dx=tp.tgt.pos.x-tp.pos.x,dz=tp.tgt.pos.z-tp.pos.z;const d=Math.hypot(dx,dz)||1;
        const k=12*G.aiSpd;ax=dx/d*k+(-dz/d)*Math.sin(G.anim*2+tp.wob)*4;az=dz/d*k+(dx/d)*Math.sin(G.anim*2+tp.wob)*4}
    }
    tp.vel.x+=ax*dt;tp.vel.z+=az*dt;
    const sp=Math.hypot(tp.vel.x,tp.vel.z);const maxV=10*(.45+tp.spin*.55);
    if(sp>maxV){tp.vel.x*=maxV/sp;tp.vel.z*=maxV/sp}
    const fr=Math.exp(-dt*.6);tp.vel.x*=fr;tp.vel.z*=fr;
    tp.pos.x+=tp.vel.x*dt;tp.pos.z+=tp.vel.z*dt;
    tp.spin-=dt*G.decay;
    // ふち（はねかえる。ルールによっては強くぶつかると落ちて負け）
    const d=Math.hypot(tp.pos.x,tp.pos.z),lim=G.ar-1.1;
    if(d>lim){const nx=tp.pos.x/d,nz=tp.pos.z/d;const vn=tp.vel.x*nx+tp.vel.z*nz;
      if(vn>0){tp.vel.x-=nx*vn*1.6;tp.vel.z-=nz*vn*1.6;tp.spin-=Math.min(.12,vn*.012);
        if(G.edgeOut&&vn>7){tp.out=true;tp.spin=0;if(tp.isP)toast('ふちから落ちた！')}}
      tp.pos.x=nx*lim;tp.pos.z=nz*lim}
  });
  // コマどうしの衝突
  const T=G.tops;
  for(let i=0;i<T.length;i++)for(let j=i+1;j<T.length;j++){const A=T[i],B=T[j];if(A.out||B.out)continue;
    const dx=B.pos.x-A.pos.x,dz=B.pos.z-A.pos.z;const dist=Math.hypot(dx,dz)||.001;
    if(dist<2.6){const nx=dx/dist,nz=dz/dist;const ov=(2.6-dist)/2;
      A.pos.x-=nx*ov;A.pos.z-=nz*ov;B.pos.x+=nx*ov;B.pos.z+=nz*ov;
      const vn=(B.vel.x-A.vel.x)*nx+(B.vel.z-A.vel.z)*nz;
      if(vn<0){const imp=-vn*.85;A.vel.x-=nx*imp;A.vel.z-=nz*imp;B.vel.x+=nx*imp;B.vel.z+=nz*imp;
        const loss=Math.min(.1,-vn*.01);
        A.spin-=loss*(.5+B.spin*.5);B.spin-=loss*(.5+A.spin*.5);
        if(-vn>4)SFX.pop()}
    }}
  // 回転がなくなったコマは止まって負け
  G.tops.forEach(tp=>{if(!tp.out&&tp.spin<=0){tp.spin=0;tp.out=true;if(tp.isP)toast('回転がなくなった…')}});
  const alive=G.tops.filter(t=>!t.out);
  setExtra('のこり',alive.length+'/'+G.tops.length);
  if(me.out){BLADE.end(G,false);return}
  if(alive.length===1){BLADE.end(G,true);return}
  if(p.time){const left=p.time-G.bt;setTimer(Math.max(0,left),'じかん');
    if(left<=0){const best=Math.max(...alive.map(t=>t.spin));BLADE.end(G,me.spin>=best)}}
};
function R2(G){return G.R()}
BLADE.end=(G,win)=>{if(G.over)return;setTimer(null);
  const sc=Math.max(0,Math.round(G.player.spin*100));
  banner(win?'かち！':'まけ…',1800);
  gameEnd(G,sc,'のこった回転',win)};

/* ---------------- autosave (10s) ---------------- */
const AS_KEY='bh_autosave',AS_INTERVAL=10000,AS_MAX_AGE=7*864e5;
const AS_MEM={s:null,g:{}};const AS_STATE={persist:true,last:0};
let asLabelEl=null,asLabelT=0;
function asStoreGet(){
  try{const v=localStorage.getItem(AS_KEY);if(v)return JSON.parse(v)}catch(e){AS_STATE.persist=false}
  try{const v=sessionStorage.getItem(AS_KEY);if(v)return JSON.parse(v)}catch(e){}
  return AS_MEM.s}
function asStoreSet(s){AS_MEM.s=s;let ok=false;
  try{localStorage.setItem(AS_KEY,JSON.stringify(s));ok=true}catch(e){}
  try{sessionStorage.setItem(AS_KEY,JSON.stringify(s))}catch(e){}
  AS_STATE.persist=ok;return ok}
function asRead(){return asStoreGet()}
// ゲームごとのセーブ（ブロックごとに別々に続きから遊べる）
// on=true はオンラインのセーブ。ひとりのセーブとは別の場所に保存し、互いに上書きしない
const AS_GKEY=(gid,on)=>'bh_as_'+(on?'on_':'')+gid;
function asGameGet(gid,on){const k=AS_GKEY(gid,on);
  try{const v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}
  try{const v=sessionStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}
  return AS_MEM.g[k]||null}
function asGameSet(s){const k=AS_GKEY(s.gid,!!s.on);AS_MEM.g[k]=s;
  try{localStorage.setItem(k,JSON.stringify(s))}catch(e){}
  try{sessionStorage.setItem(k,JSON.stringify(s))}catch(e){}}
const AS_SKIP={over:1,won:1,def:1,p:1,R:1,timers:1,mz:1,heights:1,vox:1,target:1,tlist:1,cellMeshes:1,drawn:1,towers:1,pads:1,foes:1,rivals:1,guards:1,mon:1,notes:1,cust:1,crystals:1,ball:1,ballMesh:1,coins:1};
function asCounters(){const out={};for(const k of Object.keys(G)){if(AS_SKIP[k])continue;const v=G[k];const t=typeof v;
    if((t==='number'&&isFinite(v))||t==='boolean'||t==='string')out[k]=v;
    else if(Array.isArray(v)&&v.length<=60&&v.every(x=>typeof x==='string'||(typeof x==='number'&&isFinite(x))))out[k]=v}
  return out}
function asSnapshot(){
  if(mode!=='game'||!G||!G.def||!P||P.dead>0||G.over||P.pos.y<-10)return null;
  let c={},x=null;try{c=asCounters();if(G.asSave)x=G.asSave()}catch(e){console.error(e)}
  return {v:2,t:Date.now(),gid:G.def.gid,on:!!onlineOn,pos:[+P.pos.x.toFixed(2),+P.pos.y.toFixed(2),+P.pos.z.toFixed(2)],gs:{c,ps:P.score,hp:P.hp,x}};
}
function asFlash(){
  if(!asLabelEl){asLabelEl=document.createElement('div');
    asLabelEl.style.cssText='position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:rgba(20,30,20,.85);color:#fff;font-size:13px;font-weight:700;opacity:0;transition:opacity .35s;pointer-events:none;z-index:99;white-space:nowrap';
    document.body.append(asLabelEl)}
  const tm=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  asLabelEl.textContent='✓ 自動保存しました（'+tm+'）';
  asLabelEl.style.opacity='1';clearTimeout(asLabelT);asLabelT=setTimeout(()=>asLabelEl.style.opacity='0',2600);
}
function asSave(){
  const s=asSnapshot();if(!s)return false;
  asStoreSet(s);asGameSet(s);AS_STATE.last=Date.now();asFlash();return true;
}
function asResume(gid,on){
  const s=gid==null?asRead():asGameGet(gid,!!on);if(!s||s.gid==null||!CATALOG[s.gid])return false;
  if(s.on&&!ROOMNET.ok){toast('オンラインにつながってから、もう一度押してください');return true}
  onlineOn=!!s.on;
  loadGame(s.gid,!onlineOn);
  try{
    const ok=s.pos&&s.pos[1]>-5&&Math.abs(s.pos[0])<400&&Math.abs(s.pos[2])<400;
    if(ok){P.pos.set(s.pos[0],s.pos[1],s.pos[2]);P.vel.set(0,0,0)}
    if(s.gs){if(s.gs.c)Object.assign(G,s.gs.c);if(typeof s.gs.ps==='number')P.score=s.gs.ps;if(typeof s.gs.hp==='number'&&s.gs.hp>0)P.hp=s.gs.hp;boardDirty=true;
      if(s.gs.x&&G.asLoad)G.asLoad(s.gs.x)}
  }catch(e){console.error(e)}
  return true;
}
function autosaveCard(){
  const s=asRead();const wrap=document.createElement('div');wrap.style.cssText='margin:0 0 12px';
  const st=document.createElement('div');st.style.cssText='font-size:12px;opacity:.75;margin:0 0 6px';
  const tm=t=>new Date(t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  st.textContent=AS_STATE.persist?'自動保存：オン（10秒ごと）'+(s?'　最終保存 '+tm(s.t):''):'自動保存：この環境では保存できません（画面を閉じると消えます）';
  wrap.append(st);
  if(s&&s.gid!=null&&CATALOG[s.gid]&&Date.now()-s.t<=AS_MAX_AGE){
    const b=document.createElement('button');b.type='button';
    b.style.cssText='display:block;width:100%;padding:12px 14px;border:0;border-radius:14px;background:#ffd23f;color:#222;font-weight:700;text-align:left;cursor:pointer;font-size:15px';
    b.textContent='▶ つづきから：'+CATALOG[s.gid].name+'（時間・スコア・進行も再開）';
    b.onclick=()=>{if(!asResume())toast('セーブデータを読めませんでした')};
    wrap.append(b)}
  return wrap;
}
setInterval(asSave,AS_INTERVAL);
addEventListener('pagehide',asSave);
document.addEventListener('visibilitychange',()=>{if(document.hidden)asSave()});

function hubStatus(t){if(t)toast(t)}
function renderTabs(){const el=$('#tabs');el.textContent='';TABS.forEach(([k,l])=>{const b=document.createElement('button');b.className='tab'+(hubTab===k?' sel':'');b.setAttribute('role','tab');
  if(GINFO[k]){const i=document.createElement('i');i.style.background=GINFO[k].c;b.append(i)}b.append(document.createTextNode(l));b.onclick=()=>{hubTab=k;store.set('bh_tab',k);renderHub();$('#hubBody').scrollTop=0};el.append(b)})}
function thumbEl(d,big){const t=document.createElement('div');t.className='thumb';const gc=GINFO[d.genre].c;
  const hue=(d.mi*37+d.vi*53)%360;t.style.background=`linear-gradient(135deg, ${gc}, hsl(${hue},70%,${42+d.vi*3}%))`;
  const s=document.createElement('div');s.className='studs';t.append(s);
  if(d.genre==='brainrot'&&!big){}
  const g=document.createElement('div');g.className='gly';g.textContent=d.gly;t.append(g);
  const tag=document.createElement('span');tag.className='gtag';tag.textContent=GINFO[d.genre].n;t.append(tag);
  const n=document.createElement('span');n.className='num';n.textContent='#'+String(d.gid+1).padStart(3,'0');t.append(n);
  if(d.genre==='brainrot'&&d.mode==='steal'&&d.vi===0){const c=iconCanvas(BR[BR.length-3].id,big?70:44);c.style.position='absolute';c.style.right=big?'14px':'6px';c.style.top=big?'10px':'6px';t.append(c)}
  return t}
function gameCard(d){const b=document.createElement('button');b.className='gcard';b.append(thumbEl(d));const n=document.createElement('div');n.className='gname';n.textContent=d.name;b.append(n);b.onclick=()=>openDetail(d);return b}
function renderHub(){renderTabs();const body=$('#hubBody');body.textContent='';
  if(hubTab==='dex')return renderDex(body);
  if(hubTab==='avatar')return renderAvatar(body);
  {body.append(autosaveCard())}
  const row=document.createElement('div');row.className='searchRow';const inp=document.createElement('input');inp.className='field';inp.id='search';inp.placeholder='ゲームをさがす';inp.value=hubQuery;
  const cnt=document.createElement('span');row.append(inp,cnt);body.append(row);
  const area=document.createElement('div');body.append(area);
  const draw=()=>{area.textContent='';const q=hubQuery.trim();
    if(hubTab==='home'&&!q){cnt.textContent='全'+CATALOG.length+'ゲーム';
      const feat=document.createElement('div');feat.className='shelf';const h=document.createElement('h3');h.textContent='注目';feat.append(h);const gr=document.createElement('div');gr.className='grid';
      [0,1,2,3,4,5].map(i=>CATALOG[i]).forEach(d=>gr.append(gameCard(d)));feat.append(gr);area.append(feat);
      if(mode==='game'&&G){const cont=document.createElement('button');cont.className='btn go';cont.style.cssText='width:100%;margin:12px 0 0';cont.textContent='「'+CATALOG[curGid].name+'」にもどる';cont.onclick=()=>{$('#hub').hidden=true;$('#hud').hidden=false};area.prepend(cont)}
      Object.keys(GINFO).forEach(gk=>{const sh=document.createElement('div');sh.className='shelf';const h=document.createElement('h3');const i=document.createElement('i');i.style.cssText=`width:10px;height:10px;border-radius:3px;background:${GINFO[gk].c};display:inline-block`;h.append(i,document.createTextNode(GINFO[gk].n));const sm=document.createElement('small');sm.textContent=CATALOG.filter(x=>x.genre===gk).length+'ゲーム';h.append(sm);
        const more=document.createElement('button');more.className='btn ghost';more.style.cssText='margin-left:auto;padding:5px 10px;font-size:12px';more.textContent='すべて見る';more.onclick=()=>{hubTab=gk;renderHub()};h.append(more);sh.append(h);
        const gr=document.createElement('div');gr.className='grid';const R=rng(hashStr(gk+new Date().getDate()));const list=CATALOG.filter(d=>d.genre===gk);const picks=[];
        list.filter(d=>d.vi===0).forEach(d=>picks.push(d));picks.slice(0,10).forEach(d=>gr.append(gameCard(d)));sh.append(gr);area.append(sh)});return}
    const list=CATALOG.filter(d=>(hubTab==='home'||d.genre===hubTab)&&(!q||d.name.includes(q)||d.twist.includes(q)||GINFO[d.genre].n.includes(q)));
    cnt.textContent=list.length+'ゲーム';
    if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='見つかりませんでした';area.append(e);return}
    if(hubTab!=='home'&&!q){const byMode={};list.forEach(d=>(byMode[d.mode]=byMode[d.mode]||[]).push(d));
      Object.values(byMode).forEach(arr=>{const sh=document.createElement('div');sh.className='shelf';const h=document.createElement('h3');h.textContent=arr[0].gly+'　'+arr[0].rules[0];h.style.fontSize='13px';sh.append(h);
        const gr=document.createElement('div');gr.className='grid';arr.forEach(d=>gr.append(gameCard(d)));sh.append(gr);area.append(sh)});return}
    const gr=document.createElement('div');gr.className='grid';list.forEach(d=>gr.append(gameCard(d)));area.append(gr)};
  inp.oninput=()=>{hubQuery=inp.value;draw()};draw()}
function openDetail(d){lastDetail=d;const s=$('#detailSheet');s.textContent='';s.append(thumbEl(d,true));
  const h=document.createElement('h2');h.textContent=d.name;s.append(h);
  const meta=document.createElement('div');meta.className='meta';[GINFO[d.genre].n,'#'+String(d.gid+1).padStart(3,'0'),'ひとり・オンライン'].forEach(t=>{const p=document.createElement('span');p.className='pill';p.textContent=t;meta.append(p)});
  const best=store.get('bh_best_'+d.gid,null);if(best!==null){const p=document.createElement('span');p.className='pill';p.textContent='ベスト記録あり';meta.append(p)}s.append(meta);
  const ul=document.createElement('ul');ul.className='rules';d.rules.forEach(r=>{const li=document.createElement('li');li.textContent=r;ul.append(li)});s.append(ul);
  const row=document.createElement('div');row.className='row';
  const mk=(t,cls,fn,dis)=>{const b=document.createElement('button');b.className='btn '+cls;b.textContent=t;b.disabled=!!dis;b.onclick=fn;row.append(b);return b};
  if(Net.room&&!Net.isHost){mk('ホストがゲームを選びます','ghost',()=>{},true);const n=document.createElement('p');n.className='note';n.textContent='ルームに参加中は、ホストが選んだゲームに全員で移動します。';s.append(row,n)}
  else if(Net.room&&Net.isHost){mk('このゲームをみんなで遊ぶ','go',()=>loadGame(d.gid))}
  else{const gs=asGameGet(d.gid);const fresh=!!gs&&Date.now()-gs.t<=AS_MAX_AGE;
    // ひとりで遊ぶ（通信しない）
    if(fresh){mk('▶ つづきから（ひとり）','go',()=>{onlineOn=false;$('#detail').hidden=true;if(!asResume(d.gid))toast('セーブデータを読めませんでした')});mk('ひとりで最初から','ghost',()=>{onlineOn=false;loadGame(d.gid)})}
    else mk('ひとりで遊ぶ','go',()=>{onlineOn=false;loadGame(d.gid)});
    // オンライン（ルームにいる全員と同じゲームで一緒に遊ぶ）。オンラインのセーブはひとりのセーブとは別に保存される
    const gOn=asGameGet(d.gid,true);const freshOn=!!gOn&&Date.now()-gOn.t<=AS_MAX_AGE;
    // P2P（同じ端末どうし、コードで直接つながる）：ルームを作る。参加はホームのコード入力から
    if(P2P_ON&&!Net.room)mk(window.Peer?'ルームを作ってみんなで（P2P）':'P2P準備中…','yel',()=>hostRoom(()=>{loadGame(d.gid);toast('ルーム '+Net.room+' を作りました。参加する人はこのコードを入れてください')}),!window.Peer);
    if(freshOn)mk('▶ つづきから（オンライン）','yel',()=>{$('#detail').hidden=true;if(!asResume(d.gid,true))toast('セーブデータを読めませんでした')},!ROOMNET.ok);
    mk(!ROOMNET.ok?(ROOMNET.needLogin?'オンライン（ログインが必要）':(ROOMNET.status||'オンライン準備中…')):freshOn?'オンラインで最初から':'オンラインで遊ぶ（みんなと）','yel',()=>goOnline(d.gid),!ROOMNET.ok);
    if(!ROOMNET.ok&&!ROOMNET.needLogin&&!ROOMNET.busy)mk('ページを開き直す','ghost',()=>{location.reload()});
}
  if(!(Net.room&&!Net.isHost))s.append(row);
  const close=document.createElement('button');close.className='btn ghost';close.textContent='とじる';close.onclick=()=>{$('#detail').hidden=true};s.append(close);
  $('#detail').hidden=false}
$('#detail').addEventListener('click',e=>{if(e.target.id==='detail')$('#detail').hidden=true});
function renderDex(body){const head=document.createElement('div');head.className='dexHead';const h=document.createElement('h3');h.textContent='ブレインロット図鑑';const s=document.createElement('span');s.textContent=`${DEX.size} / ${BR.length} 種類（ブレインロットのゲームで手に入れると登録）`;head.append(h,s);body.append(head);
  RAR.forEach((r,ri)=>{const sh=document.createElement('div');sh.className='shelf';const hh=document.createElement('h3');const i=document.createElement('i');i.style.cssText=`width:10px;height:10px;border-radius:3px;background:${r.c};display:inline-block`;hh.append(i,document.createTextNode(r.n));
    const sm=document.createElement('small');const L=BR_BY_R[ri];sm.textContent=L.filter(b=>DEX.has(b.id)).length+' / '+L.length;hh.append(sm);sh.append(hh);
    const gr=document.createElement('div');gr.className='dexGrid';L.forEach(b=>{const k=DEX.has(b.id);const c=document.createElement('div');c.className='dex'+(k?'':' unk');c.style.borderColor=k?r.c:'transparent';
      c.append(iconCanvas(b.id,80,k));const n=document.createElement('b');n.textContent=k?b.name:'？？？';const tg=document.createElement('small');tg.textContent=r.n;tg.style.background=ri===6?'#e9f6ff':r.c;
      const inc=document.createElement('span');inc.className='inc';inc.textContent=k?'+'+money(b.inc)+'/秒':'';c.append(n,tg,inc);gr.append(c)});sh.append(gr);body.append(sh)})}
function drawAvatar2D(cv,av){const g=cv.getContext('2d');const W=cv.width,H=cv.height;g.clearRect(0,0,W,H);const s=W/18;const a=av||me.av;const bw=BODY_W[a.bw]||1,bh=BODY_H[a.bh]||1;g.setTransform(bw,0,0,bh,W/2*(1-bw),H*.92*(1-bh));const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x*s,y*s,w*s,h*s);g.fillStyle='rgba(0,0,0,.12)';g.fillRect(x*s,(y+h)*s-s*.3,w*s,s*.3)};
  const ox=4,oy=6;R(ox+2.5,oy+0,5,5,a.skin);R(ox+0,oy+5,2.4,5,a.skin);R(ox+7.6,oy+5,2.4,5,a.skin);R(ox+2.4,oy+5,5.2,5.2,a.shirt);R(ox+2.4,oy+10.2,2.5,5,a.pants);R(ox+5.1,oy+10.2,2.5,5,a.pants);
  drawCostume2D(g,s,ox,oy,a);
  g.fillStyle='#1b1b1b';g.fillRect((ox+3.8)*s,(oy+1.6)*s,.6*s,1.1*s);g.fillRect((ox+5.6)*s,(oy+1.6)*s,.6*s,1.1*s);g.strokeStyle='#1b1b1b';g.lineWidth=s*.35;g.beginPath();g.arc((ox+5)*s,(oy+2.6)*s,1.2*s,.2*Math.PI,.8*Math.PI);g.stroke();
  drawHair2D(g,s,ox,oy,a.hair,a.hairC||'#2b1d12');
  if(a.hat==='cap'){g.fillStyle='#e5484d';g.fillRect((ox+2.3)*s,(oy-1)*s,5.4*s,1.4*s);g.fillRect((ox+5)*s,(oy+.1)*s,3.4*s,.5*s)}
  if(a.hat==='crown'){g.fillStyle='#ffcc29';g.beginPath();g.moveTo((ox+2.5)*s,oy*s);[0,1,2,3,4].forEach(i=>{g.lineTo((ox+2.5+i*1.25+.6)*s,(oy-2)*s);g.lineTo((ox+2.5+i*1.25+1.25)*s,(oy-.6)*s)});g.lineTo((ox+7.5)*s,oy*s);g.fill()}
  if(a.hat==='top'){g.fillStyle='#1a1a1a';g.fillRect((ox+1.6)*s,(oy-.4)*s,6.8*s,.6*s);g.fillRect((ox+3)*s,(oy-4)*s,4*s,3.8*s);g.fillStyle='#e5484d';g.fillRect((ox+3)*s,(oy-1.2)*s,4*s,.7*s)}
  if(a.hat==='horns'){g.fillStyle='#e5484d';[[ox+2.6,-1],[ox+7.4,1]].forEach(([x,d])=>{g.beginPath();g.moveTo(x*s,oy*s);g.lineTo((x-d*.4)*s,(oy-2)*s);g.lineTo((x+d*1.2)*s,oy*s);g.fill()})}
  if(a.hat==='halo'){g.strokeStyle='#ffcc29';g.lineWidth=s*.5;g.beginPath();g.ellipse((ox+5)*s,(oy-1.4)*s,2.4*s,.7*s,0,0,7);g.stroke()}
  drawProp2D(g,s,ox,oy,a.prop)}
function drawCostume2D(g,s,ox,oy,a){const P=COSTUMES[a.costume];if(!P)return;P.forEach(p=>{g.fillStyle=partColor(p[1],a);const X=(ox+5+p[2]*2.6)*s,Y=(oy+15.2-p[3]*2.6)*s;
  if(p[0]==='s'){g.beginPath();g.arc(X,Y,p[5]*2.6*s,0,Math.PI*2);g.fill()}else g.fillRect(X-p[5]*1.3*s,Y-p[6]*1.3*s,p[5]*2.6*s,p[6]*2.6*s)})}
function drawProp2D(g,s,ox,oy,key){const P=PROPS[key];if(!P)return;const k=1.5;P.parts.forEach(p=>{g.fillStyle=p[1];const X=(ox+5+p[2]*4*k)*s,Y=(oy+2.5-p[3]*4*k)*s;
  if(p[0]==='s'){g.beginPath();g.arc(X,Y,p[5]*4*k*s,0,Math.PI*2);g.fill()}else g.fillRect(X-p[5]*2*k*s,Y-p[6]*2*k*s,p[5]*4*k*s,p[6]*4*k*s)})}
// プリセットアバター200種（既存のはだ・シャツ・ズボン・ぼうしの組み合わせ、重複なし）
const AV_PRESETS=(()=>{const R=rng(20261010);const seen=new Set();const out=[];
  while(out.length<200){const a={skin:pick(R,SKINS),shirt:pick(R,SHIRTS),pants:pick(R,PANTS),hat:pick(R,HATS)[0]};
    const k=a.skin+a.shirt+a.pants+a.hat;if(seen.has(k))continue;seen.add(k);out.push(a)}
  return out})();
function renderAvatar(body){const w=document.createElement('div');w.className='avWrap';const pv=document.createElement('div');pv.className='avPrev';const cv=document.createElement('canvas');cv.width=360;cv.height=440;pv.append(cv);w.append(pv);
  const f=document.createElement('div');f.className='avForm';
  const nr=document.createElement('div');nr.className='row';const ni=document.createElement('input');ni.className='field';ni.id='nameIn';ni.maxLength=12;ni.value=me.name;ni.placeholder='なまえ';ni.style.flex='1';ni.oninput=()=>{me.name=cleanName(ni.value);store.set('bh_name',me.name);setMyTag()};nr.append(ni);f.append(nr);
  const sw=(lbl,list,key)=>{const r=document.createElement('div');r.className='row';const l=document.createElement('span');l.className='swl';l.textContent=lbl;r.append(l);

  sw('はだ',SKINS,'skin');sw('シャツ',SHIRTS,'shirt');sw('ズボン',PANTS,'pants');
  const hr=document.createElement('div');hr.className='row';const hl=document.createElement('span');hl.className='swl';hl.textContent='ぼうし';hr.append(hl);
  HATS.forEach(([k,l])=>{const b=document.createElement('button');b.className='hatb'+(me.av.hat===k?' sel':'');b.textContent=l;b.onclick=()=>{me.av.hat=k;store.set('bh_av',me.av);myAv.set(me.av);renderHub()};hr.append(b)});f.append(hr);
  const selRow=(lbl,list,key)=>{const r=document.createElement('div');r.className='row';const l=document.createElement('span');l.className='swl';l.textContent=lbl;r.append(l);
    list.forEach(([k,t])=>{const b=document.createElement('button');b.className='hatb'+(me.av[key]===k?' sel':'');b.textContent=t;b.onclick=()=>{me.av[key]=k;store.set('bh_av',me.av);myAv.set(me.av);renderHub()};r.append(b)});f.append(r)};
  avBuildEditor(f);
  selRow('アクセサリー',ACCS,'acc');
  const pl=document.createElement('div');pl.style.cssText='margin-top:8px';const pt=document.createElement('h3');pt.textContent='プリセット（200種類）';pt.style.cssText='margin:0 0 8px;font-size:15px';pl.append(pt);
  const grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px';
  AV_PRESETS.forEach((a,i)=>{const sel=me.av.skin===a.skin&&me.av.shirt===a.shirt&&me.av.pants===a.pants&&me.av.hat===a.hat;
    const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','プリセット'+(i+1));
    b.style.cssText='padding:6px 4px;border-radius:12px;border:3px solid '+(sel?'#fff':'transparent')+';background:rgba(255,255,255,.08);color:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px';
    const mini=document.createElement('div');mini.style.cssText='display:flex;flex-direction:column;align-items:center;width:100%';
    const hd=document.createElement('div');hd.style.cssText='width:18px;height:18px;border-radius:50%;background:'+a.skin;
    const bd=document.createElement('div');bd.style.cssText='width:22px;height:12px;border-radius:3px;background:'+a.shirt;
    const lg=document.createElement('div');lg.style.cssText='width:22px;height:8px;border-radius:2px;background:'+a.pants;
    mini.append(hd,bd,lg);const lab=document.createElement('span');lab.textContent=String(i+1).padStart(3,'0');
    b.append(mini,lab);
    b.onclick=()=>{me.av=Object.assign({},a,{hair:me.av.hair,hairC:me.av.hairC,acc:me.av.acc});store.set('bh_av',me.av);myAv.set(me.av);renderHub()};grid.append(b)});
  pl.append(grid);f.append(pl);
  // テーマスキン300種（食べ物・おかしい・ネタ）
  THEME_SKIN_CATS.forEach(cat=>{const h=document.createElement('h3');h.textContent=cat.n+'スキン（'+THEME_SKINS.filter(t=>t.cat===cat.id).length+'種類）';h.style.cssText='margin:14px 0 8px;font-size:15px';f.append(h);
    const gr=document.createElement('div');gr.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px';
    THEME_SKINS.filter(t=>t.cat===cat.id).forEach(t=>{const a=t.av;const sel=me.av.prop===a.prop&&me.av.skin===a.skin&&me.av.shirt===a.shirt&&me.av.pants===a.pants&&me.av.hat===a.hat&&me.av.hair===a.hair&&me.av.acc===a.acc;
      const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',t.name);
      b.style.cssText='padding:6px 4px;border-radius:12px;border:3px solid '+(sel?'#fff':'transparent')+';background:rgba(255,255,255,.08);color:#fff;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px';
      const tc=document.createElement('canvas');tc.width=72;tc.height=88;tc.style.cssText='width:72px;height:88px;border-radius:8px;background:#9fd8ff';drawAvatar2D(tc,Object.assign({},me.av,a));
      const lab=document.createElement('span');lab.textContent=t.name;lab.style.cssText='font-size:10px;line-height:1.2';
      b.append(tc,lab);
      b.onclick=()=>{me.av=Object.assign({},me.av,a);store.set('bh_av',me.av);myAv.set(me.av);renderHub()};gr.append(b)});
    f.append(gr)});
  const n=document.createElement('p');n.className='note';n.textContent='アバターはルームのみんなにも見えます。変更は次に入ったゲームから反映されます。';f.append(n);
  w.append(f);body.append(w);drawAvatar2D(cv)}

  if(Net.room){rs.hidden=false;$('#joinBox').hidden=true;const s=document.createElement('span');s.textContent=(Net.isHost?'ホスト ':'参加中 ')+'';const c=document.createElement('span');c.className='code';c.textContent=Net.room;
    const n=document.createElement('span');n.style.color='var(--muted)';n.textContent=(remotes.size+1)+'人';
