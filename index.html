<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ブロックひろば</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: 3D canvas underneath; hub is a full-screen game browser; in-game HUD pinned to corners. Toy-brick UI. */
:root{
  --panel:rgba(17,22,38,.82);
  --panel-solid:#161c2f;
  --panel-2:#1f2740;
  --ink:#ffffff;
  --muted:#aeb8d6;
  --brick:#ffcc29;
  --brick-dark:#c99a00;
  --go:#27c46f;
  --go-dark:#16894b;
  --blue:#2f7bff;
  --blue-dark:#1b4fb3;
  --danger:#ff4d5e;
  --danger-dark:#a3202d;
  --line:rgba(255,255,255,.14);
  --g-brainrot:#ff4fb8;
  --g-tycoon:#27c46f;
  --g-obby:#ff8a1f;
  --g-slow:#3fb0ff;
  --g-rpg:#a46bff;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--panel-solid);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:var(--ui);font-weight:800;color:var(--ink);cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
input{font-family:var(--ui);user-select:text;-webkit-user-select:text}

.btn{background:var(--blue);border-radius:12px;padding:10px 14px;font-size:15px;box-shadow:0 4px 0 var(--blue-dark);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-dark)}
.btn.go{background:var(--go);box-shadow:0 4px 0 var(--go-dark)}
.btn.go:active{box-shadow:0 1px 0 var(--go-dark)}
.btn.yel{background:var(--brick);color:#2a2000;box-shadow:0 4px 0 var(--brick-dark)}
.btn.yel:active{box-shadow:0 1px 0 var(--brick-dark)}
.btn.red{background:var(--danger);box-shadow:0 4px 0 var(--danger-dark)}
.btn.ghost{background:rgba(255,255,255,.10);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn.on{background:var(--brick);color:#2a2000;box-shadow:0 4px 0 var(--brick-dark)}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{min-width:0;background:rgba(0,0,0,.35);border:2px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font-size:16px;font-weight:800}
.field:focus{border-color:var(--brick);outline:none}
.code{font-family:var(--display);letter-spacing:.18em;text-transform:uppercase}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}

/* ---------- HUB ---------- */
#hub{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(12,16,30,.93),rgba(12,16,30,.97));padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hubTop{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:26px;line-height:1;color:var(--brick);text-shadow:0 2px 0 var(--brick-dark),0 4px 0 #6d5300;margin:0;white-space:nowrap}
.hubTop .grow{flex:1}
.roomBox{display:flex;gap:6px;align-items:center}
.roomBox .field{width:120px;padding:7px 10px;font-size:15px}
.roomBox .btn{padding:8px 12px;font-size:14px}
#roomState{font-size:13px;font-weight:800;color:var(--brick);display:flex;gap:6px;align-items:center}
.tabs{display:flex;gap:6px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);font-size:14px;color:var(--muted)}
.tab.sel{background:var(--ink);color:#141a2c}
.tab i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:1px}
.hubBody{flex:1;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.searchRow{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.searchRow .field{flex:1}
.searchRow span{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.shelf h3{font-size:15px;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.shelf h3 small{color:var(--muted);font-weight:500;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.gcard{display:flex;flex-direction:column;gap:6px;background:none;padding:0;text-align:left}
.thumb{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.thumb .gly{font-family:var(--display);font-size:38px;color:rgba(255,255,255,.95);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.thumb .studs{position:absolute;inset:0;background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.22) 0 5px,transparent 6px);background-size:22px 22px;opacity:.6}
.thumb .gtag{position:absolute;left:6px;top:6px;font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff}
.thumb .num{position:absolute;right:6px;bottom:5px;font-size:10px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.gname{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.gcard:hover .thumb,.gcard:focus-visible .thumb{transform:translateY(-2px);transition:transform .12s}
.empty{color:var(--muted);text-align:center;padding:40px 0}

/* detail sheet */
.sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{width:min(520px,100%);max-height:calc(100% - 20px);overflow-y:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet .thumb{aspect-ratio:16/8}
.sheet .thumb .gly{font-size:64px}
.sheet h2{margin:0;font-size:22px;text-wrap:balance}
.sheet .meta{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--muted)}
.rules{margin:0;padding-left:20px;line-height:1.75;font-size:14px}
.rules li::marker{color:var(--brick)}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row .btn{flex:1;min-width:140px}

/* dex */
.dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.dex{background:var(--panel-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px solid transparent}
.dex canvas{width:80px;height:80px}
.dex b{font-size:12px;line-height:1.3;min-height:2.6em;display:flex;align-items:center}
.dex small{font-size:10px;padding:1px 7px;border-radius:999px;color:#141a2c;font-weight:800}
.dex .inc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.dex.unk b{color:var(--muted)}
.dexHead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.dexHead h3{margin:0}
.dexHead span{color:var(--muted);font-size:13px}

/* avatar tab */
.avWrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.avPrev{background:linear-gradient(#8fd0ff,#cfeaff);border-radius:16px;padding:10px;flex:none}
.avPrev canvas{width:180px;height:220px;display:block}
.avForm{flex:1;min-width:240px;display:flex;flex-direction:column;gap:10px}
.avForm .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swl{font-size:12px;color:var(--muted);width:48px;flex:none}
.sw{width:30px;height:30px;border-radius:8px;border:3px solid transparent;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);padding:0}
.sw.sel{border-color:#fff}
.hatb{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px}
.hatb.sel{background:var(--brick);color:#2a2000}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
.tl{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);display:flex;gap:8px;align-items:flex-start;max-width:calc(100vw - 210px)}
#objBox{display:flex;flex-direction:column;gap:2px;white-space:normal;align-items:flex-start;max-width:min(330px,100%)}
#gTitle{font-size:12px;color:var(--brick)}
#objective{font-size:13px;line-height:1.4;font-weight:800}
.chips{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none!important}
.chips b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--brick);font-variant-numeric:tabular-nums}
.chips span{font-size:11px;color:var(--muted)}
.coinIco{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a0,#ffc400 55%,#c48a00);display:inline-block}
#board{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);width:200px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.boardHead{display:flex;justify-content:space-between;padding:6px 10px;background:rgba(255,255,255,.07);font-weight:800;font-size:11px;letter-spacing:.06em;color:var(--muted)}
#boardList{list-style:none;margin:0;padding:3px 0;max-height:170px;overflow-y:auto}
#boardList li{display:grid;grid-template-columns:1fr auto;gap:6px;padding:3px 10px;font-variant-numeric:tabular-nums}
#boardList li.me{color:var(--brick)}
#boardList li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hpWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(280px,46vw);display:flex;flex-direction:column;gap:3px;pointer-events:none!important}
#hpWrap .lbl{display:flex;justify-content:space-between;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
.bar{height:12px;border-radius:999px;background:rgba(0,0,0,.5);overflow:hidden;border:2px solid rgba(255,255,255,.25)}
.bar i{display:block;height:100%;background:linear-gradient(#4be38a,#1fa35a);width:100%;transition:width .15s}
.bar.xp{height:7px}
.bar.xp i{background:linear-gradient(#ffe27a,#f2b400)}
.bl{position:absolute;left:calc(env(safe-area-inset-left,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(320px,calc(100vw - 20px));display:flex;flex-direction:column;gap:6px}
#chatLog{display:flex;flex-direction:column;gap:2px;max-height:130px;overflow:hidden;justify-content:flex-end;pointer-events:none}
#chatLog div{background:rgba(0,0,0,.42);border-radius:8px;padding:3px 8px;font-size:13px;width:fit-content;max-width:100%;overflow-wrap:anywhere;transition:opacity 1s}
#chatLog div.old{opacity:0}
#chatLog .sys{color:var(--brick)}
#chatLog b{color:#9fd0ff}
#chatForm{display:flex;gap:6px}
#chatForm input{flex:1;min-width:0;background:rgba(0,0,0,.55);border:2px solid var(--line);border-radius:10px;color:#fff;padding:8px 10px;font-size:16px}
.br{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:10px;align-items:flex-end}
.br .col{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.round{width:78px;height:78px;border-radius:50%;font-size:14px;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.5);box-shadow:none;backdrop-filter:blur(4px);line-height:1.15;padding:4px}
.round:active{background:rgba(255,204,41,.6)}
#btnAct{background:rgba(255,204,41,.35);border-color:var(--brick)}
#btnAct.idle{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}
#prompt{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--brick);border-radius:12px;padding:8px 14px;font-weight:800;font-size:15px;white-space:nowrap}
#prompt kbd{background:var(--brick);color:#2a2000;border-radius:6px;padding:2px 8px;font-family:var(--ui)}
body.touch #prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 190px);right:auto}
#emotePanel{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 190px);display:flex;flex-direction:column;gap:8px}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10);border:3px solid rgba(255,255,255,.35);left:calc(env(safe-area-inset-left,0px) + 80px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);pointer-events:none!important;transform:translate(-50%,50%)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.55)}
#sideMenu{position:absolute;top:calc(env(safe-area-inset-top,0px) + 60px);left:calc(env(safe-area-inset-left,0px) + 10px);width:min(300px,calc(100vw - 20px));background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:5}
#sideMenu .bigcode{font-family:var(--display);font-size:30px;color:var(--brick);letter-spacing:.18em}
#banner{position:absolute;top:28%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(40px,11vw,86px);color:var(--brick);text-shadow:0 4px 0 var(--brick-dark),0 8px 0 #6d5300,0 14px 30px rgba(0,0,0,.6);pointer-events:none!important;animation:pop .5s cubic-bezier(.2,1.6,.4,1);white-space:nowrap}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(-50%,-50%) scale(1)}}
#flash{position:absolute;inset:0;background:radial-gradient(transparent 50%,rgba(255,0,40,.45));opacity:0;transition:opacity .25s;pointer-events:none!important}
#flash.on{opacity:1;transition:none}

/* generic panel (shops, merge grid, upgrades) */
#panel{position:absolute;right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 200px);width:min(330px,calc(100vw - 20px));max-height:calc(100% - 300px);min-height:120px;overflow-y:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:4}
#panel h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center}
#panel h3 button{background:rgba(255,255,255,.12);border-radius:8px;padding:4px 10px;font-size:13px}
.pitem{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:10px;padding:8px}
.pitem .t{flex:1;min-width:0}
.pitem .t b{display:block;font-size:13px}
.pitem .t small{display:block;font-size:11px;color:var(--muted)}
.pitem .btn{padding:7px 10px;font-size:13px;flex:none}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mcell{aspect-ratio:1;border-radius:10px;background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;padding:2px;border:2px solid transparent;color:var(--ink)}
.mcell canvas{width:40px;height:40px}
.mcell.sel{border-color:var(--brick)}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:16px;z-index:6}
#result .sheet{text-align:center;align-items:center}
#result h2{font-family:var(--display);font-weight:400;font-size:40px;color:var(--brick)}
#fish{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(320px,86vw);background:var(--panel-solid);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;z-index:5}
#fishTrack{position:relative;width:100%;height:34px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden}
#fishZone{position:absolute;top:0;bottom:0;background:rgba(39,196,111,.55);border:2px solid #27c46f;border-radius:8px}
#fishNeedle{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:var(--brick);border-radius:3px}
#fishMsg{font-weight:800;font-size:15px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);background:var(--brick);color:#2a2000;font-weight:800;padding:9px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;z-index:20}
#toast.show{opacity:1}
#help{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45);z-index:7}
#help ul{margin:0;padding-left:18px;line-height:1.8;font-size:14px}
kbd{background:rgba(255,255,255,.14);border-radius:5px;padding:1px 6px;font-family:var(--ui);font-size:12px}
.touch-only,.br .col.touch-only{display:none}
body.touch .touch-only,body.touch .br .col.touch-only{display:flex}
body.touch .desk-only{display:none!important}
body.touch #board{width:150px;font-size:12px}
body.touch #boardList{max-height:90px}
body.touch #chatLog{max-height:80px}
body.touch .bl{width:min(260px,calc(100vw - 200px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
body.touch #hpWrap{left:calc(env(safe-area-inset-left,0px) + 10px);transform:none;width:min(180px,40vw)}
body.touch #panel{top:calc(env(safe-area-inset-top,0px) + 130px);max-height:calc(100% - 330px)}
@media (max-width:640px){
  .chips{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 46px)}
  body.touch .chips{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 112px);left:auto;right:10px;transform:none;flex-direction:column;align-items:flex-end}
  .tl{max-width:calc(100vw - 175px)}
  #objective{font-size:12px}
  .logo{font-size:22px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
}
@media (prefers-reduced-motion:reduce){#banner{animation:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<!-- ============ HUB ============ -->
<div id="hub">
  <div class="hubTop">
    <h1 class="logo">ブロックひろば</h1>
    <div class="grow"></div>
    <div id="roomState" hidden></div>
    <div class="roomBox" id="joinBox">
      <input id="codeIn" class="field code" maxlength="5" placeholder="コード" aria-label="ルームコード" autocomplete="off">
      <button class="btn" id="btnJoin">参加</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="hubBody" id="hubBody"></div>
</div>
<div class="sheetWrap" id="detail" hidden><div class="sheet" id="detailSheet"></div></div>

<!-- ============ HUD ============ -->
<div id="hud" hidden>
  <div class="tl">
    <button class="btn ghost" id="btnMenu" aria-label="メニュー" style="padding:8px 13px;font-size:18px">≡</button>
    <div class="chip" id="objBox"><span id="gTitle"></span><span id="objective"></span></div>
  </div>
  <div class="chips">
    <div class="chip" id="cMoney" hidden><i class="coinIco"></i><b id="moneyNum">0</b><span id="moneySub"></span></div>
    <div class="chip" id="cTimer" hidden><span id="timerLbl">のこり</span><b id="timerNum">0</b></div>
    <div class="chip" id="cExtra" hidden><span id="extraLbl"></span><b id="extraNum"></b></div>
  </div>
  <div id="board"><div class="boardHead"><span>プレイヤー <span id="pcount">1</span></span><span id="scoreLbl">スコア</span></div><ol id="boardList"></ol></div>
  <div id="hpWrap" hidden>
    <div class="lbl"><span id="lvLbl">Lv 1</span><span id="hpLbl">100/100</span></div>
    <div class="bar"><i id="hpBar"></i></div>
    <div class="bar xp" id="xpWrap"><i id="xpBar" style="width:0"></i></div>

function tone(f0,f1,dur,type='square',vol=.12,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
const SFX={
  jump:()=>tone(330,620,.12,'square',.06),
  coin:()=>{tone(988,988,.07,'square',.07);tone(1319,1319,.16,'square',.07,.07)},
  cash:()=>{tone(1568,1568,.05,'square',.06);tone(2093,2093,.12,'square',.06,.05)},
  buy:()=>[660,880,1100].forEach((f,i)=>tone(f,f,.08,'triangle',.1,i*.05)),
  check:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.12,'triangle',.12,i*.07)),
  die:()=>{tone(420,90,.45,'sawtooth',.1);tone(300,60,.5,'square',.05,.05)},
  boing:()=>tone(160,720,.3,'sine',.18),
  hit:()=>tone(220,80,.1,'square',.1),
  swing:()=>tone(900,300,.1,'sawtooth',.04),
  magic:()=>tone(500,1400,.18,'sine',.09),
  hurt:()=>tone(200,120,.15,'sawtooth',.1),
  pop:()=>tone(400,900,.08,'sine',.12),
  chat:()=>tone(880,1100,.06,'sine',.05),
  bite:()=>{tone(700,700,.05,'square',.1);tone(700,700,.05,'square',.1,.1)},
  splash:()=>tone(300,60,.3,'sawtooth',.05),
  steal:()=>[880,660,990].forEach((f,i)=>tone(f,f,.07,'square',.08,i*.06)),
  alarm:()=>[880,600,880,600].forEach((f,i)=>tone(f,f,.1,'square',.07,i*.12)),
  lose:()=>[392,330,262].forEach((f,i)=>tone(f,f,.25,'triangle',.12,i*.2)),
  goal:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,f,.16,'triangle',.13,i*.11)),
  rare:()=>[784,988,1175,1568,1976].forEach((f,i)=>tone(f,f,.14,'triangle',.12,i*.08)),
};

/* ---------------- player ---------------- */
const PHYS0={grav:110,jump:36,speed:16,ice:0};
const PHYS=Object.assign({},PHYS0);
let HW=.75,PH=5.2;
const P={pos:new V3(0,1,0),vel:new V3(),ry:Math.PI,onGround:false,ground:null,dead:0,emote:0,moving:false,speedMul:1,hp:100,maxHp:100,iframe:0,score:0,carry:-1,dirX:0,dirZ:1,stun:0};
let myAv=null,myTag=null;

function gatherSolids(){return W.solids}
function overlaps(b,m=0){return Math.abs(P.pos.x-b.x)<HW+b.hx+m&&Math.abs(P.pos.z-b.z)<HW+b.hz+m&&P.pos.y<b.y+b.hy+m&&P.pos.y+PH>b.y-b.hy-m}
function moveAxis(ax,d,c,wasGround){if(!d)return;P.pos[ax]+=d;
  for(const b of c){if(b.off||!overlaps(b))continue;if(b.passable&&b.passable())continue;
    if(ax==='y'){if(d<0){P.pos.y=b.y+b.hy;P.vel.y=0;P.onGround=true;P.ground=b}else{P.pos.y=b.y-b.hy-PH;P.vel.y=0}}
    else{const top=b.y+b.hy;
      if(wasGround&&top-P.pos.y<=1.25&&top-P.pos.y>0){P.pos.y=top;continue}
      const h=ax==='x'?b.hx:b.hz;P.pos[ax]=d>0?b[ax]-h-HW-1e-4:b[ax]+h+HW+1e-4;
      if(b.onBump)b.onBump()}}}

const keys={};let jumpHeld=false,actQueued=false;
const joy={id:null,ox:0,oy:0,vx:0,vy:0};
const cam={yaw:0,pitch:.38,dist:20};

function spawnPoint(){if(G&&G.spawn)return G.spawn();const c=W.checkpoints[0];return c?new V3(c.x,c.y+c.hy+.05,c.z):new V3(0,1,0)}
function respawn(){P.pos.copy(spawnPoint());P.vel.set(0,0,0);P.dead=0;myAv.root.visible=true;P.emote=0;P.hp=P.maxHp;P.iframe=1;if(G&&G.onRespawn)G.onRespawn()}
function die(reason){if(P.dead>0)return;P.dead=1.3;shatter(myAv);SFX.die();if(G&&G.onDeath)G.onDeath(reason);sendState()}
function hurt(d,from){if(P.dead>0||P.iframe>0||d<=0)return;P.hp-=d;P.iframe=.45;SFX.hurt();const f=$('#flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),60);
  if(from){const dx=P.pos.x-from.x,dz=P.pos.z-from.z,l=Math.hypot(dx,dz)||1;P.knock={x:dx/l*18,z:dz/l*18,t:.18}}
  if(G&&G.onHurt)G.onHurt(d);if(P.hp<=0){P.hp=0;die('hp')}}

function updatePlayer(dt,t){
  if(P.iframe>0)P.iframe-=dt;
  if(P.dead>0){P.dead-=dt;if(P.dead<=0)respawn();return}
  if(P.ground&&P.ground.move){P.pos.x+=P.ground.dx;P.pos.z+=P.ground.dz}
  let ix=0,iz=0;
  if(!chatting()&&!P.locked){ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);iz=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)}
  if(joy.id!==null&&!P.locked){ix+=joy.vx;iz-=joy.vy}
  const len=Math.hypot(ix,iz);if(len>1){ix/=len;iz/=len}
  const fx_=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw);
  const dx=rx*ix+fx_*iz,dz=rz*ix+fz*iz;
  P.moving=len>.08;
  const sp=PHYS.speed*P.speedMul;
  const onIce=PHYS.ice||(P.ground&&P.ground.type==='ice');
  if(onIce){const a=Math.min(1,dt*(PHYS.ice?1.8:1.4));P.vel.x=lerp(P.vel.x,dx*sp,a);P.vel.z=lerp(P.vel.z,dz*sp,a)}
  else{P.vel.x=dx*sp;P.vel.z=dz*sp}
  if(P.knock&&P.knock.t>0){P.knock.t-=dt;P.vel.x+=P.knock.x;P.vel.z+=P.knock.z}
  if(P.ground&&P.ground.conv){P.vel.x+=P.ground.conv.x;P.vel.z+=P.ground.conv.z}
  if(P.wind){P.vel.x+=P.wind.x;P.vel.z+=P.wind.z}
  if(P.moving){P.ry=lerpAng(P.ry,Math.atan2(dx,dz),Math.min(1,dt*14));P.emote=0;P.dirX=dx;P.dirZ=dz}
  const wantJump=(jumpHeld||(!chatting()&&keys[' ']))&&!P.locked;
  if(wantJump&&P.onGround){P.vel.y=PHYS.jump;P.onGround=false;P.emote=0;SFX.jump()}
  P.vel.y=Math.max(-95,P.vel.y-PHYS.grav*dt);
  const wasGround=P.onGround;P.onGround=false;const prevGround=P.ground;P.ground=null;
  const c=gatherSolids();
  moveAxis('x',P.vel.x*dt,c,wasGround);moveAxis('z',P.vel.z*dt,c,wasGround);moveAxis('y',P.vel.y*dt,c,wasGround);
  if(G&&G.extraGround&&P.vel.y<=0){const gy=G.extraGround(P.pos);if(gy!==null&&P.pos.y<=gy){P.pos.y=gy;P.vel.y=0;P.onGround=true}}
  const g=P.ground;
  if(g){
    if(g.type==='bounce'){P.vel.y=g.power||70;P.onGround=false;SFX.boing()}
    if(g.onStand)g.onStand(dt);
    if(g!==prevGround&&g.onLand)g.onLand();
  }
  for(const k of W.kills)if(!k.off&&overlaps(k,.05)){die('kill');break}
  if(P.pos.y<-12&&P.dead<=0){die('fall')}
  if(P.pos.y<(G&&G.voidY!==undefined?G.voidY:-40))die('fall');
}

/* ---------------- remote players ---------------- */
const remotes=new Map();
function addRemote(id,name,av,s){if(id===Net.myId)return null;removeRemote(id,true);
  const A=makeAvatar(av);const tag=makeLabel(cleanName(name),{fs:38,bg:'rgba(0,0,0,.45)'});tag.position.y=6.3;A.root.add(tag);
  const r={id,name:cleanName(name),A,tag,tx:0,ty:3,tz:0,tr:0,moving:false,air:false,emote:0,score:0,dead:false,carry:-1,bubble:null,bt:0,fresh:true,tool:''};
  remotes.set(id,r);if(s)applyState(r,s);boardDirty=true;return r}
function removeRemote(id,quiet){const r=remotes.get(id);if(!r)return;r.A.dispose();disposeSprite(r.bubble);remotes.delete(id);boardDirty=true;if(!quiet&&G&&G.onPlayerLeave)G.onPlayerLeave(id)}
const TOOLS=['','sword','staff','bow','rod','net','pick','hammer','camera','can'];
function applyState(r,s){if(!Array.isArray(s)||s.length<11)return;
  const [x,y,z,ry,mv,air,em,sc,carry,dead,tool]=s;
  if(![x,y,z,ry].every(Number.isFinite))return;
  r.tx=x;r.ty=y;r.tz=z;r.tr=ry;r.moving=!!mv;r.air=!!air;r.emote=em|0;
  if(Number.isFinite(sc)&&sc!==r.score){r.score=sc;boardDirty=true}
  const cid=Number.isInteger(carry)?carry:-1;r.carry=cid;r.A.setCarry(cid);
  const tk=TOOLS[tool|0]||'';if(tk!==r.tool){r.tool=tk;r.A.setTool(tk)}
  if(s[11])r.A.swing=.3;
  if(dead&&!r.dead)shatter(r.A);
  if(!dead&&r.dead)r.A.root.visible=true;
  r.dead=!!dead;
  if(r.fresh){r.A.root.position.set(x,y,z);r.A.root.rotation.y=ry;r.fresh=false}}
function bubble(A,holder,text){disposeSprite(holder.bubble);const b=makeLabel(text,{fs:34,bg:'rgba(255,255,255,.95)',fg:'#16203a',wrap:420});b.position.y=7.3;A.root.add(b);holder.bubble=b;holder.bt=6}
const myBubble={bubble:null,bt:0};
const _rv=new V3();
function updateRemotes(dt,t){
  for(const r of remotes.values()){const R=r.A.root,k=Math.min(1,dt*12);
    _rv.set(r.tx,r.ty,r.tz);
    if(R.position.distanceTo(_rv)>25)R.position.copy(_rv);
    else R.position.lerp(_rv,k);
    R.rotation.y=lerpAng(R.rotation.y,r.tr,k);
    animateAvatar(r.A,dt,r,t);
    if(r.bubble){r.bt-=dt;if(r.bt<=0){disposeSprite(r.bubble);r.bubble=null}}}
  if(myBubble.bubble){myBubble.bt-=dt;if(myBubble.bt<=0){disposeSprite(myBubble.bubble);myBubble.bubble=null}}
}

/* =====================================================================
   キャラクリエイター拡張：髪型400種・目/口・体型・髪色
   髪型は「かたち10 × 長さ4 × 前髪5 × かざり2 = 400種」を自動で組み立てる
   ===================================================================== */
const HAIR_CAPS=[
  {id:'bowl',n:'ボウル'},{id:'full',n:'ふんわり'},{id:'side',n:'サイド'},{id:'swept',n:'かきあげ'},
  {id:'spiky',n:'とがり'},{id:'afro',n:'アフロ'},{id:'mohawk',n:'モヒカン'},{id:'flat',n:'スポーツ'},
  {id:'curl',n:'くるくる'},{id:'wave',n:'うねうね'}
];
const HAIR_LENS=[{v:0,n:'ショート'},{v:1,n:'ミディアム'},{v:2,n:'ロング'},{v:3,n:'とてもロング'}];
const HAIR_BANGS=[{v:0,n:''},{v:1,n:'ぱっつん'},{v:2,n:'ななめ前髪'},{v:3,n:'センターわけ'},{v:4,n:'すかし前髪'}];
const HAIR_XTRAS=[{v:0,n:''},{v:1,n:'リボン'}];
const HAIR_CAT=[];
HAIR_CAPS.forEach(c=>HAIR_LENS.forEach(l=>HAIR_BANGS.forEach(b=>HAIR_XTRAS.forEach(x=>{
  const id='h'+String(HAIR_CAT.length).padStart(3,'0');
  HAIR_CAT.push({id,cap:c.id,capN:c.n,len:l.v,bang:b.v,xtra:x.v,name:c.n+'・'+l.n+(b.n?'・'+b.n:'')+(x.n?'・'+x.n:'')});
}))));
const HAIR_BY_ID=Object.fromEntries(HAIR_CAT.map(h=>[h.id,h]));
HAIRS.push(...HAIR_CAT.map(h=>[h.id,h.name]));

const EYE_TYPES=['まるい','ぱっちり','ねこ目','たれ目','ジト目','キラキラ'];
const MOUTH_TYPES=['にっこり','おおきく','まっすぐ','ω'];
const EYE_C=['#1b1b1b','#3b82f6','#22c55e','#a855f7','#f59e0b','#8b5a2b','#ef4444','#0ea5e9'];
const HAIR_C_ALL=['#2b1d12','#f2c94c','#e5484d','#7a4cff','#3b82f6','#f2f2f2','#8b5a2b','#c9a26b','#ff7ab6','#3fc36a','#1c4fa8','#a46bff','#ff8a1f','#6b7280'];

/* 3D：髪型を組み立てる（頭の上に置く。hcは髪色） */
function buildHair(hg,hc,id){
  const L=c=>new THREE.MeshLambertMaterial({color:c});
  const B=(w,h,d,x,y,z,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),L(c||hc));m.position.set(x,y,z);m.castShadow=true;hg.add(m);return m};
  const S=(r,x,y,z,c)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),L(c||hc));m.position.set(x,y,z);m.castShadow=true;hg.add(m);return m};
  // 従来の4種はそのまま
  if(id==='short'){B(1.34,.42,1.34,0,.74,0);B(1.34,.7,.22,0,.25,-.6);return}
  if(id==='long'){B(1.34,.42,1.34,0,.74,0);B(1.34,1.5,.26,0,-.1,-.62);B(.26,.9,1.1,-.66,.1,0);B(.26,.9,1.1,.66,.1,0);return}
  if(id==='spiky'){[[-.4,0],[0,0],[.4,0],[-.2,.4],[.2,.4]].forEach(([x,z])=>{const c=new THREE.Mesh(new THREE.ConeGeometry(.22,.7,6),L(hc));c.position.set(x,.95,z);c.castShadow=true;hg.add(c)});return}
  if(id==='bun'){B(1.34,.42,1.34,0,.74,0);S(.42,0,1.05,-.5);return}
  const h=HAIR_BY_ID[id];if(!h)return;
  // かたち（頭のてっぺん）
  switch(h.cap){
    case 'bowl':B(1.34,.42,1.34,0,.74,0);break;
    case 'full':B(1.4,.56,1.4,0,.78,0);break;
    case 'side':B(1.36,.42,1.36,0,.74,0);B(.3,.62,1.2,-.6,.4,0);break;
    case 'swept':B(1.36,.3,1.36,0,.8,0);B(1.36,.26,.55,0,.7,.45);break;
    case 'spiky':[[-.4,0],[0,0],[.4,0],[-.2,.4],[.2,.4]].forEach(([x,z])=>{const c=new THREE.Mesh(new THREE.ConeGeometry(.22,.7,6),L(hc));c.position.set(x,.95,z);c.castShadow=true;hg.add(c)});break;
    case 'afro':S(.85,0,.55,-.05);break;
    case 'mohawk':B(.3,.75,1.36,0,.95,0);break;
    case 'flat':B(1.36,.14,1.36,0,.66,0);break;
    case 'curl':B(1.3,.3,1.3,0,.72,0);for(let i=0;i<8;i++){const a=i/8*Math.PI*2;S(.25,Math.cos(a)*.6,.85,Math.sin(a)*.6)}break;
    case 'wave':B(1.36,.42,1.36,0,.74,0);S(.24,-.45,.25,-.7);S(.24,0,.2,-.75);S(.24,.45,.25,-.7);break;
  }
  // 長さ（うしろと横の髪）
  if(h.cap!=='spiky'){
    if(h.len>=1)B(1.34,.6,.22,0,.1,-.6);
    if(h.len>=2)B(1.34,1.4,.24,0,-.2,-.62);
    if(h.len>=3){B(.26,1.4,1.1,-.66,-.2,0);B(.26,1.4,1.1,.66,-.2,0)}
  }
  // 前髪
  if(h.bang===1)B(1.3,.26,.2,0,.6,.66);
  if(h.bang===2)B(.9,.28,.2,-.2,.62,.66,null).rotation.z=.25;
  if(h.bang===3){B(.5,.3,.2,-.36,.6,.66);B(.5,.3,.2,.36,.6,.66)}
  if(h.bang===4){B(.3,.2,.18,-.4,.56,.66);B(.3,.2,.18,0,.6,.66);B(.3,.2,.18,.4,.56,.66)}
  // かざり
  if(h.xtra===1)B(.32,.3,.32,.66,.82,.1,'#ff7ab6');
}

/* 2D（プレビュー）：髪型の大まかな形 */
function drawHair2D(g,s,ox,oy,id,hc){
  const R=(x,y,w,h,c)=>{g.fillStyle=c||hc;g.fillRect((ox+x)*s,(oy+y)*s,w*s,h*s)};
  if(id==='short'||id==='bun'){R(2.2,-.2,5.6,1.2);return}
  if(id==='long'){R(2.2,-.2,5.6,1.2);R(1.8,-.2,.8,3.4);R(7.4,-.2,.8,3.4);return}
  if(id==='spiky'){for(let i=0;i<5;i++)R(2.4+i*1.1,-1.2,.8,1.2);return}
  const h=HAIR_BY_ID[id];if(!h)return;
  if(h.cap==='mohawk')R(4.4,-2.4,1.2,2.6);
  else if(h.cap==='afro')R(1.6,-1.2,6.8,2.6);
  else if(h.cap==='flat')R(2.2,.2,5.6,.5);
  else R(2.2,-.2,5.6,{full:1.5,swept:.9,curl:1.2,wave:1.2}[h.cap]||1.2);
  if(h.cap!=='spiky'){
    if(h.len>=1){R(1.9,-.2,.6,1.9);R(7.5,-.2,.6,1.9)}
    if(h.len>=2){R(1.8,-.2,.8,3.4);R(7.4,-.2,.8,3.4)}
  }
  if(h.bang===1)R(2.4,.8,5.2,.5);
  if(h.bang===2)R(2.4,.8,3,.5);
  if(h.bang===3){R(2.4,.8,2.3,.5);R(5.3,.8,2.3,.5)}
  if(h.bang===4){R(2.4,.8,1.5,.4);R(4.5,.9,1.5,.4);R(6.6,.8,1.2,.4)}
  if(h.xtra===1)R(7.6,-.6,.8,.8,'#ff7ab6');
}

/* 編集画面：体型・顔・髪色・髪型（400種）を組み立てる */
let avCapSel='bowl';
function avBuildEditor(f){
  const setAv=(k,v)=>{me.av[k]=v;store.set('bh_av',me.av);myAv.set(me.av);renderHub()};
  const row=lbl=>{const r=document.createElement('div');r.className='row';const l=document.createElement('span');l.className='swl';l.textContent=lbl;r.append(l);return r};
  const chip=(r,text,sel,fn)=>{const b=document.createElement('button');b.type='button';b.className='hatb'+(sel?' sel':'');b.textContent=text;b.onclick=fn;r.append(b);return b};
  const swatch=(r,c,sel,fn,lbl)=>{const b=document.createElement('button');b.type='button';b.className='sw'+(sel?' sel':'');b.style.background=c;b.setAttribute('aria-label',lbl+' '+c);b.onclick=fn;r.append(b)};

  let r=row('せい');[['short','ひくめ'],['normal','ふつう'],['tall','たかめ']].forEach(([k,t])=>chip(r,t,me.av.bh===k,()=>setAv('bh',k)));f.append(r);
  r=row('はば');[['slim','ほそめ'],['normal','ふつう'],['big','がっしり']].forEach(([k,t])=>chip(r,t,me.av.bw===k,()=>setAv('bw',k)));f.append(r);
  r=row('目の形');EYE_TYPES.forEach((t,i)=>chip(r,t,me.av.eye===i,()=>setAv('eye',i)));f.append(r);
  r=row('目の色');EYE_C.forEach(c=>swatch(r,c,me.av.eyeC===c,()=>setAv('eyeC',c),'目の色'));f.append(r);
  r=row('口');MOUTH_TYPES.forEach((t,i)=>chip(r,t,me.av.mouth===i,()=>setAv('mouth',i)));f.append(r);
  r=row('かみいろ');HAIR_C_ALL.forEach(c=>swatch(r,c,me.av.hairC===c,()=>setAv('hairC',c),'かみいろ'));f.append(r);

  const hh=document.createElement('div');hh.className='row';const hl=document.createElement('span');hl.className='swl';hl.textContent='かみがた';hh.append(hl);
  const note=document.createElement('span');note.style.cssText='font-size:12px;color:var(--muted)';note.textContent='400種類（10のかたち×4つの長さ×5種の前髪×2つのかざり）';hh.append(note);f.append(hh);
  r=document.createElement('div');r.className='row';r.style.flexWrap='wrap';
  chip(r,'基本',avCapSel==='basic',()=>{avCapSel='basic';renderHub()});
  HAIR_CAPS.forEach(c=>chip(r,c.n,avCapSel===c.id,()=>{avCapSel=c.id;renderHub()}));
  f.append(r);
  const list=avCapSel==='basic'?HAIRS.filter(h=>['none','short','long','spiky','bun'].includes(h[0])):HAIR_CAT.filter(h=>h.cap===avCapSel).map(h=>[h.id,h.name]);
  const grid=document.createElement('div');grid.style.cssText='display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;padding:4px;margin-bottom:8px';
  list.forEach(([k,t])=>{const b=document.createElement('button');b.type='button';b.className='hatb'+(me.av.hair===k?' sel':'');b.textContent=t;b.style.cssText='font-size:12px;width:auto;flex:none';b.onclick=()=>setAv('hair',k);grid.append(b)});
  f.append(grid);
}

/* =====================================================================

  const h=document.createElement('h3');h.append(document.createTextNode(panelRender.title));const x=document.createElement('button');x.textContent='とじる';x.onclick=closePanel;h.append(x);p.append(h);

function pitem(parent,title,sub,btn,enabled,onClick,cls){const d=document.createElement('div');d.className='pitem';
  const t=document.createElement('div');t.className='t';const b=document.createElement('b');b.textContent=title;t.append(b);

  const h=document.createElement('h2');h.textContent=o.title||(o.win?'クリア！':'ゲームオーバー');s.append(h);
  if(o.text){const p=document.createElement('p');p.style.cssText='margin:0;font-size:15px;line-height:1.6';p.textContent=o.text;s.append(p)}
  const row=document.createElement('div');row.className='row';row.style.width='100%';
  const a=document.createElement('button');a.className='btn go';a.textContent='もう一度';a.onclick=()=>{loadGame(curGid,true)};
  const c=document.createElement('button');c.className='btn ghost';c.textContent=o.cont?'つづける':'ゲームを選ぶ';c.onclick=()=>{if(o.cont){$('#result').hidden=true}else toHub()};
  row.append(a,c);s.append(row);$('#result').hidden=false;
  if(o.win){SFX.goal();confetti(P.pos)}else SFX.lose();
  if(G)G.over=!o.cont;

let curPrompt=null,curPromptLbl='';
const _pp=new V3();
function promptPos(o){if(o.pos&&o.pos.isVector3)return o.pos;if(o.obj)return o.obj.position;if(o.posFn)return o.posFn();return o.pos}
function updatePrompts(){let best=null,bd=1e9,lbl='';
  if(P.dead<=0&&!P.locked&&!(G&&G.over))for(const o of prompts){if(o.show&&!o.show())continue;const p=promptPos(o);if(!p)continue;
    const d=Math.hypot(P.pos.x-p.x,P.pos.z-p.z),dy=Math.abs(P.pos.y+2-(p.y||0));if(d<o.r&&dy<(o.ry||6)&&d<bd){const l=typeof o.label==='function'?o.label():o.label;if(!l)continue;best=o;bd=d;lbl=l}}
  curPrompt=best;

  const ab=$('#btnAct');const al=best?lbl:(G&&G.actionLabel)?G.actionLabel():'';

function nearestEnemy(range,fwdOnly){let best=null,bd=range;for(const e of enemies){if(e.dead)continue;const d=dist2(e.pos,P.pos);if(d<bd){best=e;bd=d}}return best}
function updateEnemies(dt,t){const cq=camera.quaternion;
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
    if(e.dead){world.remove(e.g);disposeTree(e.g);world.remove(e.bar);disposeTree(e.bar);enemies.splice(i,1);continue}
    const d=e.d;const dx=P.pos.x-e.pos.x,dz=P.pos.z-e.pos.z,dist=Math.hypot(dx,dz);
    if(e.stun>0)e.stun-=dt;
    let mvx=0,mvz=0;
    if(d.ai){const r=d.ai(e,dt,t);if(r){mvx=r.x;mvz=r.z}}
    else if(e.stun<=0){
      const aggro=d.aggro||26;
      if(dist<aggro&&P.dead<=0){
        if(d.ranged&&dist<d.ranged){e.cd-=dt;if(e.cd<=0){e.cd=d.rate||2;enemyShoot(e,d)}if(dist<d.ranged*.5){mvx=-dx/dist;mvz=-dz/dist}}
        else if(dist>(d.reach||2.4)){mvx=dx/dist;mvz=dz/dist}
        else{e.cd-=dt;if(e.cd<=0){e.cd=d.rate||1.1;hurt(d.dmg,e.pos);if(e.g.userData.A)e.g.userData.A.swing=.3}}
        if(d.special)d.special(e,dt,t,dist);
      }else{e.wt-=dt;if(e.wt<=0){e.wt=2+Math.random()*3;e.wdir=Math.random()*7;e.wmove=Math.random()<.6}
        if(e.wmove&&dist2(e.pos,e.home)<14){mvx=Math.cos(e.wdir)*.4;mvz=Math.sin(e.wdir)*.4}else if(dist2(e.pos,e.home)>=14){const hx=e.home.x-e.pos.x,hz=e.home.z-e.pos.z,hl=Math.hypot(hx,hz);mvx=hx/hl*.5;mvz=hz/hl*.5}}
    }
    const sp=(d.spd||6)*(e.slow>0?.4:1);if(e.slow>0)e.slow-=dt;
    e.pos.x+=mvx*sp*dt;e.pos.z+=mvz*sp*dt;
    if(e.knock&&e.knock.t>0){e.knock.t-=dt;e.pos.x+=e.knock.x*dt;e.pos.z+=e.knock.z*dt}

function enemyShoot(e,d){const from=new V3(e.pos.x,e.pos.y+(d.fly?0:3),e.pos.z),to=new V3(P.pos.x,P.pos.y+2.5,P.pos.z);const v=to.sub(from).normalize().multiplyScalar(d.pspd||22);

function updateProjs(dt){for(let i=projs.length-1;i>=0;i--){const p=projs[i];p.life-=dt;p.pos.addScaledVector(p.vel,dt);
  if(p.grav)p.vel.y-=p.grav*dt;

  if(p.enemy){if(P.dead<=0&&Math.abs(p.pos.x-P.pos.x)<1.3&&Math.abs(p.pos.z-P.pos.z)<1.3&&p.pos.y>P.pos.y-.5&&p.pos.y<P.pos.y+5.5){hurt(p.dmg,p.pos);hit=true}}
  else for(const e of enemies){if(e.dead)continue;const r=(e.d.size||1)*(e.d.kind==='golem'||e.d.kind==='dragon'?3:1.6);
    if(Math.hypot(p.pos.x-e.pos.x,p.pos.z-e.pos.z)<r&&p.pos.y>e.pos.y-1&&p.pos.y<e.pos.y+r*3+2){
      if(p.aoe){for(const e2 of enemies)if(!e2.dead&&dist2(e2.pos,p.pos)<p.aoe)damageEnemy(e2,p.dmg,0,0);puff(p.pos,p.color,8,8)}
      else damageEnemy(e,p.dmg,p.vel.x/50,p.vel.z/50);
      if(p.slow)e.slow=p.slow;
      hit=!p.pierce;break}}
  if(p.pos.y<0)hit=true;
  if(hit||p.life<=0){scene.remove(p.m);projs.splice(i,1)}}}
function clearProjs(){for(const p of projs)scene.remove(p.m);projs.length=0}
P.atkCd=0;
function playerAttack(w){if(P.atkCd>0||P.dead>0)return;P.atkCd=w.cd;myAv.swing=.3;swingFlag=true;
  const range=w.kind==='sword'||w.kind==='hammer'?(w.range||6.5):(w.range||30);
  const tgt=nearestEnemy(range);
  let fx_=Math.sin(P.ry),fz=Math.cos(P.ry);
  if(tgt){const dx=tgt.pos.x-P.pos.x,dz=tgt.pos.z-P.pos.z,l=Math.hypot(dx,dz)||1;fx_=dx/l;fz=dz/l;P.ry=Math.atan2(fx_,fz)}
  if(w.kind==='sword'||w.kind==='hammer'){SFX.swing();
    const reach=w.range||6.5;
    for(const e of enemies){if(e.dead)continue;const dx=e.pos.x-P.pos.x,dz=e.pos.z-P.pos.z,l=Math.hypot(dx,dz);const er=(e.d.size||1)*(e.d.kind==='golem'||e.d.kind==='dragon'?3:1);
      if(l<reach+er&&(l<2||(dx*fx_+dz*fz)/l>.25))damageEnemy(e,w.dmg*(Math.random()<.12?2:1),dx/(l||1),dz/(l||1))}
    const arc=new THREE.Mesh(new THREE.RingGeometry(reach-1.2,reach,16,1,-.9,1.8),new THREE.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:.6,side:THREE.DoubleSide}));
    arc.rotation.x=-Math.PI/2;arc.rotation.z=Math.atan2(fz,fx_);arc.position.set(P.pos.x,P.pos.y+2,P.pos.z);scene.add(arc);
    fx.push({m:arc,v:new V3(),r:new V3(),life:.15,g:0,shrink:false,sprite:false,disposeGeo:true})}
  else{SFX.magic();const from=new V3(P.pos.x+fx_,P.pos.y+3,P.pos.z+fz);let v;
    if(tgt){v=new V3(tgt.pos.x,tgt.pos.y+(tgt.d.fly?0:1.5),tgt.pos.z).sub(from).normalize()}else v=new V3(fx_,0,fz);
    const bow=w.kind==='bow';
    for(let k=0;k<(w.multi||1);k++){const vv=v.clone();if(k){vv.applyAxisAngle(new V3(0,1,0),(k%2?1:-1)*Math.ceil(k/2)*.18)}
      spawnProj({pos:from.clone(),vel:vv.multiplyScalar(bow?55:32),dmg:w.dmg,color:bow?'#f2e6c9':(w.color||'#a46bff'),arrow:bow,aoe:w.aoe,pierce:w.pierce,slow:w.slow,life:1.2})}}}

  else if(fishS.phase==='bar'){fishS.x+=fishS.dir*dt*1.1*fishS.speed;if(fishS.x>1){fishS.x=1;fishS.dir=-1}if(fishS.x<0){fishS.x=0;fishS.dir=1}$('#fishNeedle').style.left=fishS.x*100+'%';fishS.t-=dt;if(fishS.t<=0)endFish(false)}}

  if(fishS.x>=fishS.zone[0]&&fishS.x<=fishS.zone[1]){fishS.hits++;SFX.pop();if(fishS.hits>=fishS.need)endFish(true);else{newZone();$('#fishMsg').textContent=`あと ${fishS.need-fishS.hits} 回！`}}

/* ---------------- networking (PeerJS / WebRTC, host relays) ---------------- */
const PFX='bkhiroba26-';
const CODECH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const Net={peer:null,isHost:false,conns:new Map(),hostConn:null,room:null,myId:'me',acc:0,slots:new Map()};
const genCode=()=>Array.from({length:5},()=>CODECH[Math.floor(Math.random()*CODECH.length)]).join('');
function myState(){const s=[+P.pos.x.toFixed(2),+P.pos.y.toFixed(2),+P.pos.z.toFixed(2),+P.ry.toFixed(2),P.moving?1:0,P.onGround?0:1,P.emote,Math.round(P.score*100)/100,P.carry,P.dead>0?1:0,Math.max(0,TOOLS.indexOf(myAv.toolKind)),swingFlag?1:0];swingFlag=false;return s}
// 複数人で遊んでいるか（ルームのオンライン、またはP2Pのルームに入っている）
function online(){return (ROOMNET.ok&&onlineOn)||!!Net.room}
function send(d){
  if(ROOMNET.ok&&onlineOn){if(d.t==='st'){ROOMNET.state=d.s;return}const m=Object.assign({},d,{id:ROOMNET.key});ROOMNET.room.emit('m',m).catch(e=>{if(e&&e.code==='not_permitted'){ROOMNET.canSend=false;toast('閲覧のみのため、この操作は相手に届きません')}});return}
  if(!Net.peer)return;
  if(Net.isHost){const m=Object.assign({},d,{id:Net.myId});for(const c of Net.conns.values())if(c.open)try{c.send(m)}catch(e){}}
  else if(Net.hostConn&&Net.hostConn.open){try{Net.hostConn.send(d)}catch(e){}}}
function broadcast(m,except){for(const [id,c] of Net.conns)if(id!==except&&c.open)try{c.send(m)}catch(e){}}
function sendState(){if(!online()||mode!=='game')return;send({t:'st',s:myState()})}
function sendG(d){d.t='g';d.gid=curGid;send(d)}
function handleMsg(d){
  if(!d||typeof d!=='object'||d.id===Net.myId)return;
  const r=remotes.get(d.id);
  switch(d.t){
    case 'join':{const nr=addRemote(d.id,d.name,d.av);if(nr)nr.slot=d.slot|0;sysMsg(`${cleanName(d.name)} が参加しました`);SFX.chat();if(G&&G.onPlayerJoin)G.onPlayerJoin(d.id);break}
    case 'st':if(r)applyState(r,d.s);break;
    case 'chat':if(r&&typeof d.text==='string'){const tx=d.text.slice(0,80);chatMsg(r.name,tx);bubble(r.A,r,tx);SFX.chat()}break;
    case 'leave':if(r){sysMsg(`${r.name} がぬけました`);removeRemote(d.id)}break;
    case 'game':{if(!Number.isInteger(d.gid)||!CATALOG[d.gid])break;
      const who=(remotes.get(d.id)||{}).name||'だれか';const gname=CATALOG[d.gid].name;
      if(mode!=='game'){loadGame(d.gid,false,true);sysMsg(`${cleanName(who)} が「${gname}」を始めました`)}
      else if(d.gid!==curGid)toast(`${cleanName(who)} が「${gname}」を始めました（ホームから参加できます）`);
      break}
    case 'g':if(G&&G.net&&d.gid===curGid&&(!d.to||d.to===Net.myId))G.net(d,d.id);break;
  }}
function freeSlot(){const used=new Set([0,...Net.slots.values()]);for(let i=1;i<12;i++)if(!used.has(i))return i;return 11}
function hostRecv(conn,d){
  if(!d||typeof d!=='object')return;
  const id=conn.peer;
  if(d.t==='hello'){
    if(Net.conns.size>=11){conn.send({t:'full'});setTimeout(()=>conn.close(),300);return}
    Net.conns.set(id,conn);const slot=freeSlot();Net.slots.set(id,slot);
    const list=[{id:Net.myId,name:me.name,av:me.av,s:myState(),slot:0},...[...remotes.values()].map(r=>({id:r.id,name:r.name,av:r.A.av,slot:r.slot,s:[r.tx,r.ty,r.tz,r.tr,0,0,0,r.score,r.carry,0,0,0]}))];
    conn.send({t:'welcome',you:id,slot,gid:mode==='game'?curGid:-1,players:list});
    const nm=cleanName(d.name),av=cleanAv(d.av);
    const nr=addRemote(id,nm,av);if(nr)nr.slot=slot;broadcast({t:'join',id,name:nm,av,slot},id);sysMsg(`${nm} が参加しました`);SFX.chat();
    if(G&&G.onPlayerJoin)G.onPlayerJoin(id);return}
  if(!Net.conns.has(id))return;
  if(d.t==='game')return;
  const m=Object.assign({},d,{id});
  handleMsg(m);broadcast(m,id)}
function hostDrop(id){if(!Net.conns.has(id))return;Net.conns.delete(id);Net.slots.delete(id);const r=remotes.get(id);if(r)sysMsg(`${r.name} がぬけました`);removeRemote(id);broadcast({t:'leave',id})}
// P2P（WebRTC）は claude.ai の枠の中では使えないので止め、それ以外（Netlifyなど）では使う
const P2P_ON=false;   // P2P（WebRTC）は使わない。オンラインは中継サーバー（net_relay.js）か claude の room
// 通信サーバーにつながるまで12秒待つ。つながらなければ止めて、理由を表示する（画面が止まったままにしない）
function peerWatch(peer){const t=setTimeout(()=>{if(peer.open||Net.peer!==peer)return;try{peer.destroy()}catch(e){}Net.peer=null;hubStatus('通信サーバーにつながりませんでした。Wi-Fiやモバイル通信を確認して、もう一度試してください');if(mode==='hub')renderHub()},12000);peer.on('open',()=>clearTimeout(t))}
function hostRoom(then){
  if(!P2P_ON){toast('この版ではP2P通信は停止しています');return}
  if(!window.Peer){toast('通信ライブラリを読み込めませんでした');return}
  hubStatus('ルームを作成中…');
  resetNet();const code=genCode();const peer=new Peer(PFX+code,PEER_OPTS);Net.peer=peer;peerWatch(peer);
  peer.on('open',id=>{Net.isHost=true;Net.room=code;Net.myId=id;mySlot=0;hubStatus('');renderRoomState();if(then)then()});
  peer.on('connection',conn=>{watchIce(conn);conn.on('data',d=>hostRecv(conn,d));conn.on('close',()=>hostDrop(conn.peer));conn.on('error',()=>hostDrop(conn.peer))});
  peer.on('disconnected',()=>{if(!peer.destroyed)try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();Net.peer=null;hostRoom(then);return}netError(e)})}
function joinRoom(){
  if(!P2P_ON){hubStatus('この版ではP2P通信は停止しています');return}
  const code=$('#codeIn').value.trim().toUpperCase();
  if(!/^[A-Z0-9]{5}$/.test(code))return hubStatus('5文字のルームコードを入れてください');
  if(!window.Peer)return hubStatus('通信ライブラリを読み込めませんでした');
  resetNet();hubStatus('接続中…');
  const peer=new Peer(undefined,PEER_OPTS);Net.peer=peer;peerWatch(peer);
  peer.on('open',id=>{Net.myId=id;
    const conn=peer.connect(PFX+code,{reliable:true});Net.hostConn=conn;watchIce(conn);
    const to=setTimeout(()=>{if(!Net.room){hubStatus('つながりませんでした。コードを確認してください');resetNet()}},15000);
    conn.on('open',()=>conn.send({t:'hello',name:me.name,av:me.av}));
    conn.on('data',d=>{if(!d||typeof d!=='object')return;
      if(d.t==='full'){clearTimeout(to);hubStatus('ルームが満員です（最大12人）');resetNet();return}
      if(d.t==='welcome'){clearTimeout(to);Net.room=code;mySlot=d.slot|0;hubStatus('');
        (Array.isArray(d.players)?d.players:[]).forEach(p=>{if(!p)return;const nr=addRemote(p.id,p.name,p.av,p.s);if(nr)nr.slot=p.slot|0});
        renderRoomState();
        if(Number.isInteger(d.gid)&&CATALOG[d.gid])loadGame(d.gid);else{toast(`ルーム ${code} に参加しました。ホストがゲームを選ぶのを待っています`);renderHub()}
        return}
      handleMsg(d)});
    conn.on('close',()=>{if(Net.room){toast('ホストとの接続が切れました');resetNet();renderRoomState();if(mode==='game'&&G)sysMsg('オフラインになりました')}})});
  peer.on('error',e=>{if(e.type==='peer-unavailable'){hubStatus('ルームが見つかりません。コードを確認してください');resetNet();return}netError(e)})}
// 直接つながらない時（回線やモバイル回線の制限）に、原因がわかるように知らせる
function watchIce(conn){
  const hook=()=>{const pc=conn.peerConnection;if(!pc||pc._bhWatched)return;pc._bhWatched=1;
    pc.addEventListener('iceconnectionstatechange',()=>{
      const st=pc.iceConnectionState;
      if(st==='failed'){toast('相手とつながりませんでした。Wi-Fiとモバイル回線を切り替えて、もう一度試してください');console.warn('ice failed')}
      if(st==='disconnected')console.warn('ice disconnected')})};
  hook();setTimeout(hook,300);setTimeout(hook,1500);
}
function netError(e){console.warn(e);
  const rtc=!!(window.RTCPeerConnection||window.webkitRTCPeerConnection),framed=window.top!==window;
  const diag=' [確認: WebRTC='+(rtc?'あり':'なし')+' / 枠内表示='+(framed?'はい':'いいえ')+']';
  const msg={network:'通信サーバーにつながりません','server-error':'通信サーバーのエラーです','browser-incompatible':'このブラウザはP2P通信（WebRTC）に対応していません。Chrome（Android）やSafari（iPad）など通常のブラウザで、URLを直接開き直してください'+diag,'socket-error':'通信サーバーにつながりません'}[e.type]||('通信エラー：'+e.type);
  toast(msg);if(!Net.room){hubStatus(msg);resetNet()}}
function resetNet(){try{Net.peer&&Net.peer.destroy()}catch(e){}Object.assign(Net,{peer:null,isHost:false,hostConn:null,room:null,myId:'me'});Net.conns.clear();Net.slots.clear();mySlot=0;
  [...remotes.keys()].forEach(id=>removeRemote(id,true));boardDirty=true}
function leaveRoom(){if(Net.isHost)broadcast({t:'leave',id:Net.myId});else if(Net.hostConn)try{Net.hostConn.close()}catch(e){}resetNet();renderRoomState()}

/* =====================================================================
   オンライン接続（room機能）：いまこのページを開いている人どうしをつなぐ
   P2P（WebRTC）は使わない。状態（位置・基地など）はプレゼンスで共有し、
   操作（盗む・取り返すなど）は「m」トピックで送る（コントリビューター以上）。
   room が使えない表示（リンクの一般公開など）では、ひとりで遊べる。
   ===================================================================== */
const ROOMNET={ok:false,canSend:true,key:'',room:null,known:new Map(),state:null,status:'',busy:false,needLogin:false};

// オンラインで遊ぶかどうか。ひとりで遊ぶ時はfalse（通信せず、他の人にも見えない）

function netSlotPick(used){for(let i=0;i<12;i++)if(!used.has(i))return i;return 11}
// 接続の準備。失敗したら理由を ROOMNET.status に入れて、ホーム画面に表示する（再試行できる）
async function roomInit(){
  if(ROOMNET.ok||ROOMNET.busy)return;ROOMNET.busy=true;
  ROOMNET.status='接続の準備中…';ROOMNET.needLogin=false;if(mode==='hub')renderHub();
  try{
    let room=null,user=null;
    if(!(window.claude&&window.claude.use)){
      // claude.ai の外（ネットで公開したページ）は、中継サーバーでつなぐ
      const r=relayPair();
      if(r){
        const ok=await Promise.race([r.ready.then(()=>true,()=>false),new Promise(res=>setTimeout(()=>res(false),8000))]);
        if(!ok){ROOMNET.status='中継サーバーにつながりませんでした（通信を確認して、もう一度ためしてください）';console.warn('relay: 接続できません');return}
        room=r.room;user=r.user;

    }

      for(let i=0;i<40&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,250));
      if(!(window.claude&&window.claude.use)){ROOMNET.status='この画面ではオンラインを使えません';console.warn('roomInit: window.claude が見つかりません');return}
      try{room=await window.claude.use('room')}catch(e){console.warn('roomInit: room',e)}
      try{user=await window.claude.use('user')}catch(e){console.warn('roomInit: user',e)}
      if(!room){ROOMNET.status='接続できません（claude.aiにログインして開き直す）';console.warn('roomInit: room が null');return}
    }
    // オンラインはログインした人だけ（claude.ai の中のみ）。中継サーバーの場合はIDで区別する
    let uid=null;try{if(user&&user.id)uid=await user.id()}catch(e){}
    if(!user||!uid){ROOMNET.needLogin=true;ROOMNET.status='';console.warn('roomInit: ログインしていません');return}
    await roomStart(room,user);
  }finally{ROOMNET.busy=false;if(mode==='hub'){renderHub();if(lastDetail&&!$('#detail').hidden)openDetail(lastDetail)}}
}
// 画面が前面に戻ったら、まだつながっていなければ再試行する（スマホでアプリを切り替えた後など）
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!ROOMNET.ok&&!ROOMNET.needLogin)roomInit()});
async function roomStart(room,user){
  ROOMNET.room=room;ROOMNET.key='p'+Math.random().toString(36).slice(2,10);Net.myId=ROOMNET.key;
  try{const c=user&&user.can?await user.can('data.write'):true;ROOMNET.canSend=c!==false}catch(e){}
  const fail=()=>{ROOMNET.ok=false;[...ROOMNET.known.keys()].forEach(k=>handleMsg({t:'leave',id:k}));ROOMNET.known.clear()};
  room.on('m',msg=>{if(msg.isMe||!onlineOn)return;const d=msg.data;if(!d||typeof d!=='object'||d.id===ROOMNET.key)return;handleMsg(d)},fail);
  room.onPeers(ch=>{
    if(!ROOMNET.ok)return;
    const all=ch.peers.filter(p=>!p.isMe&&p.presence&&p.presence.k);
    // ホームにいる人は、ルームで今遊ばれているゲームに自動で参加する
    if(mode!=='game'&&onlineOn){const h=all.find(p=>Number.isInteger(p.presence.gid)&&p.presence.gid>=0&&CATALOG[p.presence.gid]);if(h){loadGame(h.presence.gid,false,true);return}}
    // 同じゲームを遊んでいる人だけを「仲間」として扱う（別のゲームの人は混ざらない）
    const myG=mode==='game'?curGid:-1;
    const others=(mode==='game'&&onlineOn)?all.filter(p=>(Number.isInteger(p.presence.gid)?p.presence.gid:-1)===myG):[];
    const used=new Set(others.map(p=>p.presence.slot|0));
    // 同じ場所を取り合ったら、キーの小さいほうが残る
    if(others.some(p=>(p.presence.slot|0)===mySlot&&p.presence.k<ROOMNET.key))mySlot=netSlotPick(used);
    const touched=new Set([...ch.joined,...ch.updated]);
    for(const p of others){const k=p.presence.k;
      if(!ROOMNET.known.has(k)){ROOMNET.known.set(k,1);handleMsg({t:'join',id:k,name:p.presence.name||'プレイヤー',av:p.presence.av,slot:p.presence.slot|0})}
      if(touched.has(p)&&p.presence.st)handleMsg({t:'st',id:k,s:p.presence.st});
    }
    for(const k of [...ROOMNET.known.keys()])if(!others.some(p=>p.presence.k===k)){ROOMNET.known.delete(k);handleMsg({t:'leave',id:k})}
  },fail);
  ROOMNET.ok=true;ROOMNET.status='';
  toast('オンラインにつながりました');
  if(mode==='hub')renderHub();
  setInterval(()=>{if(!ROOMNET.ok)return;
    // ひとりで遊ぶ時は k を null にして、ルームの他の人から見えないようにする
    const st=(mode==='game'&&onlineOn)?ROOMNET.state:null;
    const gid=(mode==='game'&&onlineOn)?curGid:-1;
    room.presence({k:onlineOn?ROOMNET.key:null,name:me.name,av:me.av,slot:mySlot,gid,st}).catch(()=>{});
  },150);
}

/* =====================================================================
   中継サーバーでつなぐオンライン（claude.ai の外＝ネットで公開したページで使う）
   claude の room と同じ形（on / onPeers / presence / emit）で動くので、
   net_room.js の処理はそのまま使える。P2P（WebRTC）は使わない。
   サーバーは同じURLの /ws（deno_deploy/main.ts）
   ===================================================================== */
function relayPair(){
  if(!/^https?:$/.test(location.protocol))return null;
  let uid=null;
  try{uid=localStorage.getItem('bh_uid');if(!uid){uid='u'+Math.random().toString(36).slice(2,12);localStorage.setItem('bh_uid',uid)}}catch(e){uid=null}
  const sid='s'+Math.random().toString(36).slice(2,10);   // このページを開いた人ごとのID
  const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
  const mOn=[],peerFns=[],failFns=[];let prevPeers=new Map(),lastP='',queue=[],opened=false,failed=false;
  let ws=null;
  const fail=()=>{if(failed)return;failed=true;failFns.forEach(f=>{try{f()}catch(e){}})};
  const send=o=>{const s=JSON.stringify(o);if(opened&&ws.readyState===1)ws.send(s);else queue.push(s)};
  let resolveReady,rejectReady;const ready=new Promise((res,rej)=>{resolveReady=res;rejectReady=rej});
  try{ws=new WebSocket(url)}catch(e){return null}
  ws.onopen=()=>{opened=true;ws.send(JSON.stringify({type:'hello',id:sid}));queue.forEach(s=>ws.send(s));queue=[];resolveReady()};
  ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(_){return}
    if(d.type==='peers'){
      const peers=(d.peers||[]).map(p=>({id:p.id,isMe:p.id===sid,presence:p.presence}));
      const now=new Map();peers.forEach(p=>now.set(p.id,p));
      const joined=peers.filter(p=>!prevPeers.has(p.id));
      const updated=peers.filter(p=>prevPeers.has(p.id)&&JSON.stringify(prevPeers.get(p.id).presence)!==JSON.stringify(p.presence));
      prevPeers=now;
      peerFns.forEach(f=>{try{f({peers,joined,updated,left:[]})}catch(err){console.warn(err)}});
    }else if(d.type==='msg'){
      mOn.filter(x=>x.topic===d.topic).forEach(x=>{try{x.fn({isMe:false,data:d.data})}catch(err){console.warn(err)}});
    }};
  ws.onclose=()=>{rejectReady(new Error('closed'));fail()};
  ws.onerror=()=>{rejectReady(new Error('error'));fail()};
  const room={
    on(topic,fn,failFn){mOn.push({topic,fn});if(failFn)failFns.push(failFn);return()=>{}},
    onPeers(fn,failFn){peerFns.push(fn);if(failFn)failFns.push(failFn)},
    presence(p){const s=JSON.stringify(p);if(s===lastP)return Promise.resolve();lastP=s;send({type:'presence',presence:p});return Promise.resolve()},
    emit(topic,data){send({type:'emit',topic,data});return Promise.resolve()}
  };
  const user={id:async()=>uid||sid,can:async()=>true};
  return {room,user,ready};
}

/* critters: wandering things you can catch (brainrots, bugs, animals) */
const critters=[];
function addCritter(g,x,z,o={}){g.position.set(x,o.y||0,z);world.add(g);
  const c=Object.assign({g,pos:g.position,dir:Math.random()*7,wt:0,spd:4,flee:0,fleeSpd:10,fly:false,baseY:o.y||0,hp:1,dead:false,area:60,cx:0,cz:0},o);critters.push(c);
  if(o.label){c.tag=o.label;c.tag.position.y=o.tagY||4;g.add(c.tag)}return c}
function updateCritters(dt,t){for(let i=critters.length-1;i>=0;i--){const c=critters[i];
  if(c.dead){world.remove(c.g);disposeTree(c.g);critters.splice(i,1);continue}
  const dx=c.pos.x-P.pos.x,dz=c.pos.z-P.pos.z,d=Math.hypot(dx,dz);let vx=0,vz=0,moving=false;
  if(c.flee&&d<c.flee&&P.dead<=0&&(!c.fleeIfRun||P.moving)){vx=dx/d*c.fleeSpd;vz=dz/d*c.fleeSpd;moving=true}
  else if(!c.still){c.wt-=dt;if(c.wt<=0){c.wt=1+Math.random()*3;c.dir=Math.random()*Math.PI*2;c.go=Math.random()<.65}if(c.go){vx=Math.cos(c.dir)*c.spd;vz=Math.sin(c.dir)*c.spd;moving=true}}
  c.pos.x+=vx*dt;c.pos.z+=vz*dt;
  const ox=c.pos.x-c.cx,oz=c.pos.z-c.cz,od=Math.hypot(ox,oz);if(od>c.area){c.pos.x=c.cx+ox/od*c.area;c.pos.z=c.cz+oz/od*c.area;c.dir+=Math.PI}
  if(c.avoid){const r=c.avoid(c.pos.x,c.pos.z);if(r){c.pos.x-=vx*dt;c.pos.z-=vz*dt;c.dir+=Math.PI}}
  if(moving&&(vx||vz))c.g.rotation.y=lerpAng(c.g.rotation.y,Math.atan2(vx,vz),Math.min(1,dt*8));
  if(c.fly)c.pos.y=c.baseY+Math.sin(t*3+c.dir)*.8;
  if(c.g.userData.m)animBrainrot(c.g,t,moving);else if(c.anim)c.anim(c,t,moving);
  if(c.update)c.update(c,dt,t)}}
function clearCritters(){for(const c of critters)c.dead=true}

BRM.catch=G=>{const p=G.p,R=G.R;const T=themeEnv(p.theme||'field');

  const caught=new Set();

    const giant=p.giant&&b.r>=2;const g=makeBrainrot(bid,giant?2.2:1);
    const tag=makeLabel(RAR[b.r].n,{fs:28,bg:'rgba(0,0,0,.5)',fg:b.r===6?'#ffffff':RAR[b.r].c});
    const c=addCritter(g,Math.cos(a)*rr,Math.sin(a)*rr,{spd:2.5+b.r*.4,flee:[0,6,9,12,14,16,18][b.r]*(p.shy||1),fleeSpd:[0,7,9,11,12.5,13.5,14.5][b.r]*(p.shy||1),area:88,label:tag,tagY:giant?2.2:4.2,hp:giant?3+b.r:1,bid});
    if(p.night&&b.r<3)g.visible=false;
    c.pr=addPrompt({obj:g,r:giant?5.5:3.4,label:()=>c.dead?null:(c.hp>1?`たたく（あと${c.hp}）`:`つかまえる：${b.name}`),act:()=>{
      if(c.hp>1){c.hp--;SFX.hit();puff(c.pos,'#ffffff',5);c.pos.x+=(c.pos.x-P.pos.x)*.2;return}
      c.dead=true;removePrompt(c.pr);P.score+=pts[b.r]*(giant?3:1);caught.add(bid);SFX.coin();floatText(new V3(c.pos.x,4,c.pos.z),'+'+pts[b.r]*(giant?3:1));puff(c.pos,RAR[b.r].c,10);
      if(dexAdd(bid))toast('図鑑に登録：'+b.name);if(b.r>=4){SFX.rare();banner(RAR[b.r].n+'ゲット！')}
      setExtra('しゅるい',caught.size);
      if(p.goalKinds&&caught.size>=p.goalKinds){showResult({win:true,title:'コンプリート！',text:`${caught.size}種類つかまえた！（${fmtTime(G.time)}）`})}

BRM.merge=G=>{const p=G.p,R=G.R;themeEnv(p.theme||'candy');

  const cells=Array(cellsN).fill(-1);let sel=-1,buys=0,best=0;econ(G,p.start||50);

  const inc=k=>Math.round(2*Math.pow(p.incBase||3,k));

    const tag=makeLabel('ランク'+(k+1),{fs:30,bg:'rgba(0,0,0,.55)',fg:'#ffcc29'});tag.position.y=4.5;g.add(tag);models[i]=g}

  function buy(){const c=price();const f=cells.indexOf(-1);if(f<0){toast('マスがいっぱい！合体させよう');return}if(G.money<c){toast('お金が足りません');return}
    G.add(-c);buys++;let k=0;if(p.box){const r=Math.random();k=r<.55?0:r<.85?1:2;k=Math.min(k,tiers-1)}cells[f]=k;show(f);SFX.buy();if(p.auto)autoMerge();check()}
  function merge(a,b){if(cells[a]<0||a===b)return false;if(cells[b]<0){cells[b]=cells[a];cells[a]=-1;show(a);show(b);return true}

    const last=s===stages;const cz=c.z-4-4;

OBM.color=G=>{const p=G.p;themeEnv(p.theme||'candy');const g0=W.solids[0];setPartOff(g0,true);

const TYM={};
GENRES.tycoon=(def,R)=>{const G=newGame(def,R);TYM[def.mode](G);return G};
const plotO=slot=>new V3(((slot%4)-1.5)*74,0,(Math.floor(slot/4)-1)*74);
const cubeGeo=keepGeo(new THREE.BoxGeometry(.9,.9,.9));
function tycoon(G,cfg){const p=G.p;const T=themeEnv(p.theme||cfg.theme||'field');
  const mul=p.mul||1;G.mul=mul;econ(G,p.start!==undefined?p.start:(cfg.start||0));G.scoreLabel='お金';G.earned=0;
  const myS=Math.min(mySlot,11);const O=plotO(myS);G.O=O;
  const pads=cfg.pads;const bought=new Set();G.bought=bought;
  for(let s=0;s<12;s++){const o=plotO(s);plat(o.x,.3,o.z,58,58,s===myS?'#d9dde3':'#c4c9d0','solid',{noShadow:true}).mesh.castShadow=false}
  sign(O.x,9,O.z-30,'あなたの'+(cfg.title||'タイクーン'),{fs:44});
  if(cfg.base)cfg.base(O,false);
  const remote={};
  function padVisible(pd){return!bought.has(pd.id)&&(!pd.req||pd.req.every(r=>bought.has(r)))}
  const padObjs={};
  function refreshPads(){for(const pd of pads){const vis=padVisible(pd);const o=padObjs[pd.id];
    if(vis&&!o){const x=O.x+pd.x,z=O.z+pd.z;const part=plat(x,.55,z,3.2,3.2,pd.cost===0?'#3a8dff':'#27c46f','solid',{kind:'glow',onLand:()=>buy(pd)});
      const lbl=makeLabel(pd.name+'\n'+(pd.cost?money(pd.cost*(p.costMul||1)):'無料'),{fs:30,bg:'rgba(0,0,0,.6)',colors:['#ffffff','#7dffb0'],center:true});lbl.position.set(x,1.2,z);world.add(lbl);padObjs[pd.id]={part,lbl}}
    if(!vis&&o){setPartOff(o.part,true);world.remove(o.lbl);disposeSprite(o.lbl);delete padObjs[pd.id]}}}
  function buy(pd){const c=Math.round(pd.cost*(p.costMul||1));if(G.money<c){toast(`お金が足りません（${money(c)}）`);return}
    G.add(-c);bought.add(pd.id);pd.build(O,false);SFX.buy();puff(new V3(O.x+pd.x,1.5,O.z+pd.z),'#ffcc29',12);refreshPads();
    if(online())sendG({k:'ty',slot:myS,ids:[...bought]});
    if(bought.size===pads.length&&!G.allDone){G.allDone=true;toast('ぜんぶ建てた！')}}

    if(!rs.sign){const r=remotes.get(from);rs.sign=sign(o.x,9,o.z-30,(r?r.name:'プレイヤー')+'の'+(cfg.title||'タイクーン'),{fs:40,fg:'#ffffff'});if(cfg.base)cfg.base(o,true)}
    d.ids.forEach(id=>{const pd=pads.find(x=>x.id===id);if(pd&&!rs.built.has(id)){rs.built.add(id);try{pd.build(o,true)}catch(e){}}})}};
  G.onPlayerJoin=()=>setTimeout(()=>{if(bought.size)sendG({k:'ty',slot:myS,ids:[...bought]})},900);
  G.spawn=()=>new V3(O.x,.35,O.z+22);
  const goal=p.goal||cfg.goal||1e5;
  setObjective(cfg.obj+`　目標：${money(goal)}`);
  if(p.time)timeLimit(G,p.time,()=>finishScore(G,G.earned,'かせいだお金'));
  let rt=0;
  G.tyUpdate=dt=>{G.tick(dt);tickLimit(G);P.score=G.money;rt+=dt;if(rt>.5){rt=0;setMoney(G.money,G.incomeText?G.incomeText():'')}
    if(!G.won&&G.money>=goal){G.won=true;showResult({win:true,title:'タイクーン達成！',text:`${money(goal)} 到達！（${fmtTime(G.time)}）このまま続けられます`,cont:true})}};
  return O}

function lineSystem(G){G.lines=[];G.droppers=[];G.cubes=[];G.beltMul=1;
  G.addLine=(O,z,vis)=>{plat(O.x-3,1,O.z+z,40,3,'#3b3f46');plat(O.x+19,1.6,O.z+z,4,4,'#ffcc29','solid',{kind:'glow'});const L={z,O,ups:[]};if(!vis)G.lines.push(L);return L};
  G.addDropper=(O,L,x,val,rate,col,vis)=>{dBox(O.x+x,4.5,O.z+L.z,2.6,2.6,2.6,col);dBox(O.x+x,2.8,O.z+L.z,.8,1,.8,'#3b3f46');addPart(O.x+x,2.3,O.z+L.z+2.2,.6,4.6,.6,'#3b3f46');if(!vis)G.droppers.push({L,x,val,rate,t:Math.random()*rate,col})};
  G.addUpgrader=(O,L,x,m,col,vis)=>{dBox(O.x+x,3.5,O.z+L.z-1.8,.6,4,.6,col,{kind:'glow'});dBox(O.x+x,3.5,O.z+L.z+1.8,.6,4,.6,col,{kind:'glow'});dBox(O.x+x,5.4,O.z+L.z,.6,.6,4.2,col,{kind:'glow'});if(!vis)L.ups.push({x,m,col})};
  G.lineUpdate=dt=>{for(const d of G.droppers){d.t-=dt;if(d.t<=0&&G.cubes.length<160){d.t=d.rate;const m=new THREE.Mesh(cubeGeo,mat(d.col,'plain'));m.position.set(d.L.O.x+d.x,2,d.L.O.z+d.L.z);world.add(m);G.cubes.push({m,L:d.L,x:d.x,v:d.val})}}
    const sp=5*G.beltMul;for(let i=G.cubes.length-1;i>=0;i--){const c=G.cubes[i];const nx=c.x+sp*dt;for(const u of c.L.ups)if(c.x<u.x&&nx>=u.x){c.v*=u.m;c.m.material=mat(u.col,'glow')}c.x=nx;c.m.position.x=c.L.O.x+c.x;c.m.rotation.y+=dt*2;
      if(c.x>17){world.remove(c.m);G.cubes.splice(i,1);G.earn(c.v)}}}}
function customerSys(G,O,o){G.custs=[];G.custT=2;G.custRate=o.rate||6;G.custMax=o.max||4;
  G.custUpdate=dt=>{if(!G.custOn)return;G.custT-=dt;if(G.custT<=0&&G.custs.length<G.custMax){G.custT=G.custRate*(.7+Math.random()*.6);const n=makeWalker(randAv(),O.x+(Math.random()-.5)*10,O.z+30,{speed:7});G.custs.push(n);o.onSpawn(n)}

TYM.restaurant=G=>{const p=G.p;let stoves=0,tables=0,chef=0,menuLv=0;const menu=['おにぎり','ラーメン','オムライス','すし','ステーキ','フルコース'];const price=[8,25,70,200,600,2000];
  let holding=false;
  const pads=[{id:'c',name:'カウンター',cost:0,x:0,z:14,build:(O,v)=>{addPart(O.x,1.6,O.z+4,14,2.2,2,'#8b5a2b');if(!v)G.custOn=true}},
    {id:'s1',name:'コンロ',cost:30,x:-6,z:14,req:['c'],build:(O,v)=>{stoveAt(O,-10,v)}},
    {id:'t1',name:'テーブル',cost:80,x:6,z:14,req:['c'],build:(O,v)=>{tableAt(O,-14,-12,v)}},
    {id:'m1',name:'メニュー：ラーメン',cost:300,x:-12,z:20,req:['s1'],build:(O,v)=>{if(!v)menuLv=1}},
    {id:'t2',name:'テーブル2',cost:500,x:12,z:20,req:['t1'],build:(O,v)=>{tableAt(O,0,-12,v)}},
    {id:'s2',name:'コンロ2',cost:1200,x:-6,z:20,req:['m1'],build:(O,v)=>{stoveAt(O,-4,v)}},
    {id:'m2',name:'メニュー：オムライス',cost:2500,x:0,z:20,req:['s2'],build:(O,v)=>{if(!v)menuLv=2}},
    {id:'ch',name:'見習いシェフ',cost:5000,x:6,z:20,req:['m2'],build:(O,v)=>{chefAt(O,v)}},
    {id:'t3',name:'テーブル3',cost:8000,x:12,z:26,req:['t2'],build:(O,v)=>{tableAt(O,14,-12,v)}},
    {id:'m3',name:'メニュー：すし',cost:20000,x:-12,z:26,req:['ch'],build:(O,v)=>{if(!v)menuLv=3}},
    {id:'ch2',name:'ベテランシェフ',cost:60000,x:-6,z:26,req:['m3'],build:(O,v)=>{chefAt(O,v)}},
    {id:'m4',name:'メニュー：ステーキ',cost:150000,x:0,z:26,req:['ch2'],build:(O,v)=>{if(!v)menuLv=4}},
    {id:'m5',name:'メニュー：フルコース',cost:600000,x:6,z:26,req:['m4'],build:(O,v)=>{if(!v)menuLv=5}},
    {id:'dc',name:'かざり',cost:2000,x:18,z:14,req:['t1'],build:(O,v)=>{dBox(O.x-20,3,O.z-20,2,6,2,'#ff7ab6');dBox(O.x+20,3,O.z-20,2,6,2,'#ff7ab6');sign(O.x,7,O.z-14,'レストラン',{fs:48})}}];
  function stoveAt(O,x,v){addPart(O.x+x,1.5,O.z-2,3,3,3,'#3b3f46');dBox(O.x+x,3.1,O.z-2,2,.2,2,'#ff5a1f',{kind:'kill',plain:true});if(v)return;stoves++;
    let cooking=0;const pos=new V3(O.x+x,1,O.z-2);addPrompt({pos,r:3,label:()=>holding?null:cooking>0?`調理中… ${cooking.toFixed(1)}秒`:'料理する',act:()=>{if(cooking>0||holding)return;cooking=Math.max(.6,2.5-stoves*.3);SFX.pop()}});
    G.stoveTick.push(dt=>{if(cooking>0){cooking-=dt;if(cooking<=0){cooking=0;holding=true;myAv.setCarry(-1);toast('できた！カウンターのお客さんに出そう');SFX.coin()}}})}
  function tableAt(O,x,z,v){addPart(O.x+x,1.4,O.z+z,4,1,4,'#c9a26b');[-1,1].forEach(k=>addPart(O.x+x+k*3,.9,O.z+z,1.4,1,1.4,'#8b5a2b'));if(!v){tables++;G.custMax=2+tables*2}}
  function chefAt(O,v){const n=makeWalker({skin:'#f2c49b',shirt:'#f2f2f2',pants:'#1c1c1c',hat:'top'},O.x-8,O.z-6,{speed:6});if(v)return;chef++}
  G.stoveTick=[];
  const O=tycoon(G,{title:'レストラン',pads,obj:'コンロで料理→カウンターのお客さんに出す。テーブルとメニューでお店を大きく'});
  customerSys(G,O,{rate:6,max:2,onSpawn:n=>{const slot=G.custs.length;walkTo(n,O.x-5+((slot*3)%12),O.z+7,()=>{n.waiting=true;n.order=Math.floor(Math.random()*(menuLv+1));n.pat=p.patience||40;bubbleOn(n,menu[n.order]+' ください')})}});
  addPrompt({pos:new V3(O.x,1,O.z+7),r:7,label:()=>{if(!holding)return null;const w=G.custs.find(n=>n.waiting);return w?'料理を出す':null},act:()=>{const w=G.custs.find(n=>n.waiting);if(!w||!holding)return;holding=false;serve(w)}});
  function serve(n){n.waiting=false;const v=price[n.order]*(1+tables*.25);G.earn(v);SFX.cash();floatText(new V3(n.pos.x,6,n.pos.z),'+'+money(v*G.mul));bubbleOn(n,'おいしい！','rgba(125,255,176,.95)');walkTo(n,O.x+(Math.random()-.5)*10,O.z+32,()=>killWalker(n))}
  let ct=0;G.incomeText=()=>holding?'料理を持っている':'';
  G.update=(dt,t)=>{G.tyUpdate(dt);G.custUpdate(dt);G.stoveTick.forEach(f=>f(dt));
    for(const n of G.custs){if(n.waiting){n.pat-=dt;if(n.pat<=0){n.waiting=false;bubbleOn(n,'おそい！','rgba(255,138,138,.95)');walkTo(n,O.x,O.z+32,()=>killWalker(n))}}}
    if(chef){ct+=dt;if(ct>Math.max(1.2,6/chef)){ct=0;const w=G.custs.find(n=>n.waiting);if(w)serve(w)}}}};

/* ---------- 3. FARM ---------- */
TYM.farm=G=>{const p=G.p;const crops=[{n:'カブ',t:5,v:6,c:'#f2f2f2'},{n:'ニンジン',t:8,v:15,c:'#ff8a1f'},{n:'トマト',t:12,v:40,c:'#e5484d'},{n:'カボチャ',t:18,v:120,c:'#ff9a1f'},{n:'スイカ',t:25,v:400,c:'#27c46f'},{n:'金のリンゴ',t:40,v:1500,c:'#ffcc29'}];
  let cropLv=0,sprink=1,auto=0;const bag=[];const plots=[];
  const pads=[{id:'f1',name:'はたけ1',cost:0,x:-18,z:20,build:(O,v)=>field(O,-16,-8,v)},
    {id:'f2',name:'はたけ2',cost:60,x:-12,z:20,req:['f1'],build:(O,v)=>field(O,-4,-8,v)},
    {id:'c1',name:'ニンジンのタネ',cost:150,x:-6,z:20,req:['f2'],build:(O,v)=>{if(!v)cropLv=1}},
    {id:'f3',name:'はたけ3',cost:500,x:0,z:20,req:['c1'],build:(O,v)=>field(O,8,-8,v)},
    {id:'c2',name:'トマトのタネ',cost:1200,x:6,z:20,req:['f3'],build:(O,v)=>{if(!v)cropLv=2}},
    {id:'sp',name:'スプリンクラー',cost:3000,x:12,z:20,req:['c2'],build:(O,v)=>{dBox(O.x,2,O.z-8,1,4,1,'#3fb0ff',{kind:'glow'});if(!v)sprink=1.6}},
    {id:'f4',name:'はたけ4',cost:6000,x:18,z:20,req:['sp'],build:(O,v)=>field(O,-16,4,v)},
    {id:'c3',name:'カボチャのタネ',cost:12000,x:-18,z:26,req:['f4'],build:(O,v)=>{if(!v)cropLv=3}},
    {id:'f5',name:'はたけ5',cost:25000,x:-12,z:26,req:['c3'],build:(O,v)=>field(O,-4,4,v)},
    {id:'hv',name:'自動しゅうかく機',cost:50000,x:-6,z:26,req:['f5'],build:(O,v)=>{dBox(O.x+16,2,O.z+4,4,3,3,'#e5484d');if(!v)auto=1}},
    {id:'c4',name:'スイカのタネ',cost:120000,x:0,z:26,req:['hv'],build:(O,v)=>{if(!v)cropLv=4}},
    {id:'f6',name:'はたけ6',cost:200000,x:6,z:26,req:['c4'],build:(O,v)=>field(O,8,4,v)},
    {id:'c5',name:'金のリンゴのタネ',cost:600000,x:12,z:26,req:['f6'],build:(O,v)=>{if(!v)cropLv=5}},
    {id:'bn',name:'なや',cost:2000,x:18,z:26,req:['f2'],build:(O,v)=>{house(O.x+20,O.z-20,10,8,6,'#c0392b','#3b3f46')}}];
  function field(O,x,z,v){for(let i=0;i<4;i++){const px=O.x+x+(i%2)*4.5-2.25,pz=O.z+z+Math.floor(i/2)*4.5-2.25;plat(px,.55,pz,4,4,'#6b4f2a');if(v)continue;
    const pl={x:px,z:pz,state:0,t:0,crop:0,m:null};plots.push(pl);
    addPrompt({pos:new V3(px,.5,pz),r:2.4,label:()=>pl.state===0?`${crops[cropLv].n}をうえる`:pl.state===1?`そだち中 ${Math.ceil(pl.t)}秒`:'しゅうかく',act:()=>{if(pl.state===0){pl.state=1;pl.crop=cropLv;pl.t=crops[cropLv].t;setPlant(pl,.3);SFX.pop()}else if(pl.state===2)harvest(pl)}})}}
  function setPlant(pl,s){if(pl.m){world.remove(pl.m);pl.m.geometry.dispose()}if(s<=0){pl.m=null;return}pl.m=dMesh(new THREE.SphereGeometry(.9,8,6),crops[pl.crop].c,pl.x,.6+.8*s,pl.z,{kind:'plain'});pl.m.scale.setScalar(s)}
  function harvest(pl){bag.push(pl.crop);pl.state=0;setPlant(pl,0);SFX.coin();setExtra('かご',bag.length)}
  const O=tycoon(G,{title:'農場',pads,obj:'タネをうえて→しゅうかく→直売所で売る'});
  const st=new V3(O.x+20,1,O.z+10);plat(st.x,1,st.z,5,4,'#ffd23f');sign(st.x,4,st.z,'直売所',{fs:34});
  addPrompt({pos:st,r:4,label:()=>bag.length?`売る（${bag.length}こ）`:'直売所',act:()=>{const v=bag.reduce((s,c)=>s+crops[c].v,0);if(!v)return;G.earn(v);bag.length=0;setExtra('かご',0);SFX.cash()}});
  setExtra('かご',0);
  G.update=dt=>{G.tyUpdate(dt);for(const pl of plots){if(pl.state===1){pl.t-=dt*sprink;setPlant(pl,clamp(1-pl.t/crops[pl.crop].t,.3,1));if(pl.t<=0){pl.state=2;if(auto)G.after(.5,()=>{if(pl.state===2){G.earn(crops[pl.crop].v*.8);pl.state=0;setPlant(pl,0)}})}}
    else if(pl.state===0&&auto){pl.state=1;pl.crop=cropLv;pl.t=crops[cropLv].t;setPlant(pl,.3)}}}};

/* ---------- 4. MINE ---------- */
TYM.mine=G=>{const p=G.p;const ores=[{n:'石',c:'#a3a9b3',v:2,hp:2},{n:'鉄',c:'#c9a26b',v:8,hp:3},{n:'金',c:'#ffcc29',v:30,hp:5},{n:'ルビー',c:'#e5484d',v:120,hp:7},{n:'ダイヤ',c:'#7ee0ff',v:500,hp:10},{n:'ドリーム鉱石',c:'#ff2bd6',v:2500,hp:14}];
  let depth=0,pick_=1,drills=0,bagMax=10;const bag=[];const nodes=[];
  const pads=[{id:'q',name:'採掘場',cost:0,x:-18,z:20,build:(O,v)=>{plat(O.x-6,.45,O.z-6,34,30,'#6b5a4a');if(!v){G.qO=O;for(let i=0;i<10;i++)spawnNode()}}},
    {id:'p1',name:'鉄のツルハシ',cost:50,x:-12,z:20,req:['q'],build:(O,v)=>{if(!v)pick_=2}},
    {id:'d1',name:'深く掘る：鉄',cost:150,x:-6,z:20,req:['p1'],build:(O,v)=>{if(!v)depth=1}},
    {id:'b1',name:'大きいバッグ',cost:400,x:0,z:20,req:['d1'],build:(O,v)=>{if(!v)bagMax=25}},
    {id:'dr1',name:'ドリル',cost:1000,x:6,z:20,req:['b1'],build:(O,v)=>{drillAt(O,16,-14,v)}},
    {id:'d2',name:'深く掘る：金',cost:3000,x:12,z:20,req:['dr1'],build:(O,v)=>{if(!v)depth=2}},
    {id:'p2',name:'金のツルハシ',cost:8000,x:18,z:20,req:['d2'],build:(O,v)=>{if(!v)pick_=4}},
    {id:'d3',name:'深く掘る：ルビー',cost:20000,x:-18,z:26,req:['p2'],build:(O,v)=>{if(!v)depth=3}},
    {id:'dr2',name:'ドリル2',cost:45000,x:-12,z:26,req:['d3'],build:(O,v)=>{drillAt(O,16,-6,v)}},
    {id:'b2',name:'特大バッグ',cost:70000,x:-6,z:26,req:['dr2'],build:(O,v)=>{if(!v)bagMax=60}},
    {id:'d4',name:'深く掘る：ダイヤ',cost:150000,x:0,z:26,req:['b2'],build:(O,v)=>{if(!v)depth=4}},
    {id:'p3',name:'ダイヤのツルハシ',cost:300000,x:6,z:26,req:['d4'],build:(O,v)=>{if(!v)pick_=8}},
    {id:'d5',name:'深く掘る：ドリーム',cost:800000,x:12,z:26,req:['p3'],build:(O,v)=>{if(!v)depth=5}}];
  function drillAt(O,x,z,v){addPart(O.x+x,3,O.z+z,3,6,3,'#ffb224');dBox(O.x+x,.5,O.z+z,1.2,1.2,1.2,'#3b3f46');if(!v)drills++}
  function spawnNode(){if(!G.qO)return;const O=G.qO;const r=Math.random();let k=0;for(let d=depth;d>=0;d--){if(r<Math.pow(.45,depth-d)){k=d;break}}k=Math.min(k,depth);
    const x=O.x-6+(Math.random()-.5)*28,z=O.z-6+(Math.random()-.5)*24;const pt=addPart(x,1.4,z,2.6,2,2.6,ores[k].c,'solid',{kind:k>=2?'glow':''});const nd={pt,k,hp:ores[k].hp};nodes.push(nd);
    nd.pr=addPrompt({pos:new V3(x,1,z),r:3.2,label:()=>bag.length>=bagMax?'バッグがいっぱい':`${ores[k].n}を掘る（${Math.ceil(nd.hp)}）`,act:()=>{if(bag.length>=bagMax){toast('売りに行こう');return}nd.hp-=pick_;myAv.swing=.3;swingFlag=true;SFX.hit();puff(new V3(x,2,z),ores[k].c,4,5);
      if(nd.hp<=0){removePrompt(nd.pr);setPartOff(pt,true);bag.push(k);setExtra('バッグ',bag.length+'/'+bagMax);SFX.coin();G.after(3,spawnNode)}}})}
  const O=tycoon(G,{title:'鉱山',pads,obj:'鉱石を掘ってトロッコで売る。ツルハシと深さを強化'});myAv.setTool('pick');
  const cart=new V3(O.x+20,1,O.z+10);dBox(cart.x,1.4,cart.z,4,2,3,'#8b5a2b');sign(cart.x,4.2,cart.z,'トロッコ（売る）',{fs:30});
  addPrompt({pos:cart,r:4,label:()=>bag.length?`売る（${bag.length}こ）`:'トロッコ',act:()=>{const v=bag.reduce((s,k)=>s+ores[k].v,0);if(!v)return;G.earn(v);bag.length=0;setExtra('バッグ','0/'+bagMax);SFX.cash()}});
  setExtra('バッグ','0/10');G.incomeText=()=>drills?'ドリル+'+money(drills*ores[depth].v*.6*G.mul)+'/秒':'';
  G.update=dt=>{G.tyUpdate(dt);if(drills)G.earn(drills*ores[depth].v*.6*dt)}};

/* ---------- 5. THEME PARK ---------- */
TYM.park=G=>{const p=G.p;let rate=0,ticket=2,trash=[];const rides=[];
  const rideDef=(id,name,cost,x,z,rx,rz,kind,add,req)=>({id,name,cost,x,z,req,build:(O,v)=>{const g=rideModel(kind,O.x+rx,O.z+rz);if(!v){rides.push({g,kind,x:O.x+rx,z:O.z+rz});rate+=add;G.custOn=true}}});
  function rideModel(kind,x,z){const g=new THREE.Group();g.position.set(x,0,z);world.add(g);
    if(kind==='merry'){const b=dMesh(new THREE.CylinderGeometry(4,4,.6,16),'#ff7ab6',0,.6,0,{parent:g});for(let i=0;i<6;i++){const a=i/6*7;dBox(Math.cos(a)*3,2,Math.sin(a)*3,.3,3,.3,'#ffcc29',{parent:g,plain:true});dBox(Math.cos(a)*3,1.4,Math.sin(a)*3,1,1,1.4,pick(Math.random,BRIGHT),{parent:g})}dMesh(new THREE.ConeGeometry(4.5,2,16),'#e5484d',0,4.5,0,{parent:g});g.userData.spin=1}
    else if(kind==='wheel'){const w=new THREE.Group();w.position.y=9;g.add(w);dMesh(new THREE.TorusGeometry(7,.3,6,24),'#3a8dff',0,0,0,{parent:w});for(let i=0;i<8;i++){const a=i/8*7;dBox(Math.cos(a)*7,Math.sin(a)*7,0,1.6,1.6,1.6,BRIGHT[i+3],{parent:w})}dBox(-2,4.5,0,.5,9,.5,'#a3a9b3',{parent:g});dBox(2,4.5,0,.5,9,.5,'#a3a9b3',{parent:g});g.userData.wheel=w}
    else if(kind==='coaster'){for(let i=0;i<12;i++){const a=i/12*7;dBox(Math.cos(a)*6,2+Math.sin(a*2)*1.5,Math.sin(a)*6,1,.3,2.4,'#ff2a3d',{parent:g});dBox(Math.cos(a)*6,1,Math.sin(a)*6,.3,2,.3,'#a3a9b3',{parent:g,plain:true})}const car=dBox(6,3,0,1.4,1,2,'#ffcc29',{parent:g});g.userData.car=car}
    else if(kind==='drop'){dBox(0,8,0,2,16,2,'#3b3f46',{parent:g});const s=dBox(0,2,0,4,1,4,'#ff8a1f',{parent:g});g.userData.drop=s}
    else if(kind==='cup'){for(let i=0;i<4;i++){const a=i/4*7;dMesh(new THREE.CylinderGeometry(1.2,.8,1.4,10),BRIGHT[i+5],Math.cos(a)*3,1,Math.sin(a)*3,{parent:g})}g.userData.spin=1}
    else{dBox(0,1.5,0,4,3,3,'#a46bff',{parent:g});sign(x,4,z,'屋台',{fs:30})}
    return g}
  const pads=[{id:'gate',name:'入場ゲート',cost:0,x:-20,z:14,build:(O,v)=>{addPart(O.x-6,4,O.z+28,2,8,2,'#ffcc29');addPart(O.x+6,4,O.z+28,2,8,2,'#ffcc29');dBox(O.x,8.5,O.z+28,14,1.5,2,'#e5484d');if(!v){rate+=.3}}},
    rideDef('r1','メリーゴーランド',100,-14,20,-14,-14,'merry',.4,['gate']),rideDef('f1','屋台',250,-8,20,-21,0,'food',.2,['r1']),rideDef('r2','コーヒーカップ',600,-2,20,0,-17,'cup',.6,['r1']),
    rideDef('r3','観覧車',2500,4,20,15,-15,'wheel',1.2,['r2']),rideDef('f2','屋台2',4000,10,20,21,0,'food',.4,['r3']),rideDef('r4','フリーフォール',10000,-14,26,-5,-3,'drop',2,['r3']),
    rideDef('r5','ジェットコースター',40000,-8,26,9,2,'coaster',4,['r4']),{id:'tk',name:'チケット値上げ',cost:15000,x:16,z:20,req:['r3'],build:(O,v)=>{if(!v)ticket=4}},
    {id:'tk2',name:'VIPチケット',cost:150000,x:-2,z:26,req:['r5'],build:(O,v)=>{if(!v)ticket=10}},rideDef('r6','ジェットコースター2',300000,4,26,-12,8,'coaster',8,['tk2'])];
  const O=tycoon(G,{title:'遊園地',pads,obj:'乗り物を建てるとお客さんが増える。ゴミをそうじしよう'});
  customerSys(G,O,{rate:4,max:16,onSpawn:n=>{const go=()=>{if(n.dead)return;const r=rides.length?pick(Math.random,rides):null;const tx=r?r.x+(Math.random()-.5)*8:O.x,tz=r?r.z+5:O.z;walkTo(n,tx,tz,()=>{G.earn(ticket);if(Math.random()<.25&&trash.length<20)dropTrash(n.pos.x,n.pos.z);n.visits=(n.visits||0)+1;if(n.visits>3)walkTo(n,O.x,O.z+34,()=>killWalker(n));else setTimeout(go,1500)})};go()}});
  function dropTrash(x,z){const m=dBox(x,.4,z,.8,.6,.8,'#6b4f2a',{plain:true});const t={m};trash.push(t);t.pr=addPrompt({pos:new V3(x,.4,z),r:2.5,label:'ゴミをひろう',act:()=>{removePrompt(t.pr);world.remove(m);m.geometry.dispose();trash.splice(trash.indexOf(t),1);G.earn(ticket*2);SFX.coin()}})}
  G.incomeText=()=>'ゴミ '+trash.length;
  G.update=(dt,t)=>{G.tyUpdate(dt);G.custRate=Math.max(.5,4/(rate||.1))*(1+trash.length*.08);G.custUpdate(dt);
    rides.forEach(r=>{const u=r.g.userData;if(u.spin)r.g.rotation.y+=dt*.8;if(u.wheel)u.wheel.rotation.z+=dt*.3;if(u.car){const a=t*1.2;u.car.position.set(Math.cos(a)*6,2.6+Math.sin(a*2)*1.5,Math.sin(a)*6)}if(u.drop)u.drop.position.y=2+Math.abs(Math.sin(t*.6))*12})}};

/* ---------- 6. SHOP (restock) ---------- */
TYM.shop=G=>{const p=G.p;const goods=[{n:'おかし',c:'#ff7ab6',v:3},{n:'ジュース',c:'#3fb0ff',v:6},{n:'パン',c:'#c9a26b',v:12},{n:'おべんとう',c:'#27c46f',v:30},{n:'ゲーム',c:'#a46bff',v:120},{n:'スマホ',c:'#1d2433',v:600}];
  const shelves=[];let cart=0,cartMax=6;

    addPrompt({pos:new V3(X,1,Z),r:5,label:()=>gen.broken?'修理する！':null,act:()=>{gen.broken=false;if(gen.smoke){world.remove(gen.smoke);disposeSprite(gen.smoke);gen.smoke=null}SFX.buy();toast('修理完了')}})}});

    genPad('g7','原子力発電',60000,18,20,-14,0,'nuke',200,['g6']),genPad('g8','原子力発電2',300000,-18,26,-2,2,'nuke',200,['g7']),
