<!--MANIFEST-->
<style>
/* Single dark look (a game screen): background and all colours set explicitly. */
:root { color-scheme: dark; --bg: #05070a; --fg: #f4f4f4; --sun: #f29f4c; --rose: #e2507a; --gold: #f2b705; }
html, body { height: 100%; background: var(--bg); color: var(--fg); }
#boot-logo { font: 900 italic clamp(44px, 9vw, 96px)/0.9 "Arial Black", Arial, sans-serif; letter-spacing: -1px; text-align: center;
  background: linear-gradient(180deg, #ffe08a 0%, var(--sun) 50%, var(--rose) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
#boot-sub { margin-top: 8px; letter-spacing: 6px; font-size: 12px; opacity: .7; text-transform: uppercase; font-family: system-ui, sans-serif; }
.confirm { position: fixed; inset: 0; z-index: 35; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
.confirm .panel { width: min(380px, 90vw); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<canvas id="game" aria-label="VISTA COAST game view"></canvas>
<div id="loading" class="loading" style="position:fixed;inset:0;z-index:40;background:#07090c;display:flex;align-items:center;justify-content:center;flex-direction:column">
  <div id="boot-logo">VISTA COAST</div>
  <div id="boot-sub">Next-Gen Open World</div>
  <div class="bar2" style="width:min(420px,80vw);height:6px;border-radius:3px;background:#1d2128;overflow:hidden;margin-top:22px"><i id="loadbar" style="display:block;height:100%;width:0;background:linear-gradient(90deg,#f29f4c,#e2507a)"></i></div>
  <div id="loadmsg" class="msg" style="margin-top:10px;font:13px system-ui,sans-serif;opacity:.7">読み込み中…</div>
</div>
<div id="title" class="title" style="display:none">
  <div class="logo">VISTA COAST</div>
  <div class="tagline">海と陽射しと、自由の街</div>
  <button id="btnContinue" class="btn primary" type="button">続きから</button>
  <button id="btnNew" class="btn" type="button">はじめから</button>
  <p style="margin-top:14px;font:12px system-ui;opacity:.6;text-align:center;padding:0 16px">PC：WASD＋マウス／ゲームパッド対応／スマホ：画面ボタン操作（ホーム画面に追加して全画面プレイ推奨）</p>
</div>
<div id="newConfirm" class="confirm"><div class="panel"><h2>はじめから？</h2><p style="opacity:.8">今のセーブデータは、次にセーブしたときに上書きされます。</p><button id="btnNewYes" class="btn primary" type="button">はじめから遊ぶ</button><button id="btnNewNo" class="btn" type="button">やめる</button></div></div>
<div id="err" class="err" style="position:fixed;inset:0;z-index:99;background:#180a0a;color:#fff;display:none;padding:24px;font:14px/1.5 monospace;white-space:pre-wrap;overflow:auto"></div>
